<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campeonato Leyendas del Fútbol - Comuneros</title>
<style>
  :root{
    --yellow:#F7C600;
    --yellow-dark:#E0AF00;
    --black:#141414;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family: 'Arial Black', Arial, sans-serif;
    background:#e8e8e8;
    margin:0;
    padding:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    min-height:100vh;
    min-height:100dvh;
  }

  /* ===== Ajustes para pantallas pequeñas (celulares) ===== */
  @media (max-width:600px){
    body{padding:10px;gap:10px;}
    #tabs{width:100%;justify-content:center;flex-wrap:wrap;}
    #tabs button{flex:1 1 auto;font-size:12px;padding:8px 10px;}
    .toolbar{gap:6px;}
    .toolbar button{font-size:12px;padding:8px 12px;}
    #db-panel{padding:12px 10px;}
  }
  @media (max-height:700px){
    body{padding:10px;gap:8px;}
  }

  /* ===== TABS ===== */
  #tabs{
    display:flex;
    gap:4px;
    background:#d8d8d8;
    padding:4px;
    border-radius:10px;
  }
  #tabs button{
    font-family:Arial, sans-serif;
    font-size:14px;
    font-weight:bold;
    padding:9px 20px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:#555;
    cursor:pointer;
  }
  #tabs button.active{
    background:var(--black);
    color:var(--yellow);
  }

  .tab-panel{display:none;flex-direction:column;align-items:center;gap:16px;width:100%;}
  .tab-panel.active{display:flex;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .toolbar button{
    background:var(--black);
    color:var(--yellow);
    border:2px solid var(--yellow);
    border-radius:8px;
    padding:9px 16px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    font-family:Arial, sans-serif;
  }
  .toolbar button:hover{background:var(--yellow);color:var(--black);}
  .toolbar button.secondary{background:var(--white);color:var(--black);border:2px solid var(--black);}
  .toolbar button.secondary:hover{background:#f2f2f2;}

  /* ===== PANEL: base de datos de equipos ===== */
  #db-panel{
    width:826px;
    max-width:95vw;
    background:#fff;
    border:2px solid var(--black);
    border-radius:10px;
    padding:16px 18px;
    font-family:Arial, sans-serif;
  }
  #db-panel h2{margin:0 0 10px 0;font-size:16px;color:var(--black);display:flex;align-items:center;gap:8px;}
  #db-status{font-size:12px;color:#888;margin-bottom:10px;}
  #teams-list{display:flex;flex-direction:column;gap:6px;}
  .team-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#fbfbfb;border:1px solid #ddd;border-radius:6px;padding:9px 12px;font-size:13px;
  }
  .team-row .team-info{display:flex;flex-direction:column;gap:2px;}
  .team-row .team-info b{font-size:14px;color:var(--black);}
  .team-row .team-info span{font-size:11px;color:#888;}
  .team-row .team-actions{display:flex;gap:6px;}
  .team-row button{font-size:12px;padding:5px 10px;border-radius:5px;border:1px solid #ccc;background:#fff;cursor:pointer;}
  .team-row button.load-btn{background:var(--yellow);border-color:var(--yellow-dark);font-weight:bold;}
  .team-row button.delete-btn{color:#b30000;}
  .empty-msg{font-size:13px;color:#999;font-style:italic;}

  /* ===== CARD: 8cm x 13.2cm (más delgada) ===== */
  #scaleOuter{display:flex;justify-content:center;overflow:hidden;}
  #scaleInner{transform-origin:top center;}
  #card-wrapper{box-shadow:0 4px 24px rgba(0,0,0,.25);}
  #card{
    width:945px;    /* 8cm @300dpi */
    height:1559px;  /* 13.2cm @300dpi */
    background:var(--white);
    position:relative;
    border:9px solid var(--black);
    padding:10px;
    overflow:hidden;
  }
  #card-inner{
    width:100%;height:100%;
    border:5px solid var(--yellow);
    position:relative;
    padding:22px 24px 16px 24px;
    display:flex;flex-direction:column;
  }

  .notch{position:absolute;width:32px;height:32px;background:var(--black);}
  .notch.tl{top:-9px;left:-9px;clip-path:polygon(0 0,100% 0,0 100%);}
  .notch.tr{top:-9px;right:-9px;clip-path:polygon(100% 0,100% 100%,0 0);}
  .notch.bl{bottom:-9px;left:-9px;clip-path:polygon(0 100%,100% 100%,0 0);}
  .notch.br{bottom:-9px;right:-9px;clip-path:polygon(100% 100%,0 100%,100% 0);}

  .ball{width:52px;height:52px;flex:0 0 auto;}
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .stars{font-size:18px;color:var(--yellow-dark);letter-spacing:2px;}
  .speedlines{display:flex;flex-direction:column;gap:3px;width:28px;}
  .speedlines div{height:3px;background:var(--yellow-dark);border-radius:2px;}
  .speedlines div:nth-child(1){width:100%;}
  .speedlines div:nth-child(2){width:70%;}
  .speedlines div:nth-child(3){width:45%;}

  h1.title-main{text-align:center;font-size:40px;letter-spacing:2px;color:var(--black);margin:2px 0 0 0;font-family:'Arial Black',Arial,sans-serif;}
  h1.title-mega{
    text-align:center;font-size:56px;line-height:0.95;color:var(--yellow);
    -webkit-text-stroke:2px var(--black);margin:4px 0 8px 0;
    font-family:'Arial Black',Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;
  }

  .banner-row{display:flex;align-items:center;gap:10px;margin:0 0 12px 0;}
  .banner-line{flex:1;height:3px;background:var(--yellow);border-radius:2px;}
  .banner{
    position:relative;background:var(--black);color:var(--white);padding:10px 32px;
    font-size:32px;letter-spacing:6px;text-align:center;transform:rotate(-1deg);
    border-radius:4px;white-space:nowrap;
  }

  .hexrow{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .hex{
    width:54px;height:54px;flex:0 0 auto;background:var(--black);
    clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%);
    display:flex;align-items:center;justify-content:center;
  }
  .hex svg{width:28px;height:28px;}
  .label-text{font-size:20px;color:var(--black);white-space:nowrap;}
  .cat-box{background:var(--yellow);border-radius:6px;padding:8px 18px;font-size:25px;color:var(--black);flex:1;text-align:center;}
  .fill-box{flex:1;border:2px solid var(--yellow-dark);border-radius:20px;min-height:40px;padding:6px 16px;font-size:18px;color:var(--black);display:flex;align-items:center;}

  .section-row{display:flex;align-items:center;gap:12px;margin:4px 0 8px 0;}
  .section-line{flex:1;height:3px;background:var(--yellow);border-radius:2px;}
  .section-title{font-size:29px;color:var(--black);white-space:nowrap;text-transform:uppercase;}
  .hex-sm{width:42px;height:42px;background:var(--yellow);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .hex-sm svg{width:22px;height:22px;}

  /* ===== TABLA: columnas más compactas ===== */
  table{width:100%;border-collapse:separate;border-spacing:3px;flex:1;table-layout:fixed;}
  thead th{
    background:var(--yellow);color:var(--black);font-size:14px;padding:8px 6px;min-height:38px;
    border:2px solid var(--yellow-dark);border-radius:20px;text-transform:uppercase;letter-spacing:0.2px;line-height:1.15;
  }
  thead th:nth-child(1){width:6%;}
  thead th:nth-child(2){width:70%;}
  thead th:nth-child(3){width:24%;}
  tbody td{border:2px solid var(--yellow-dark);border-radius:20px;font-size:20px;font-weight:bold;text-align:center;color:var(--black);padding:6px 10px;height:42px;min-height:42px;line-height:1.2;vertical-align:middle;}
  tbody td.name-cell{text-align:left;padding:6px 0 6px 16px;font-weight:bold;font-size:23px;}
  tbody td[contenteditable]:focus{box-shadow: inset 0 0 0 2px var(--black); background:#fffbe6; outline:none;}

  .sign-row{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding-top:4px;}
  .sign-text{font-size:15px;color:var(--black);white-space:nowrap;flex:0 0 auto;}
  .sign-line{flex:1;border-bottom:2px solid var(--black);min-height:22px;font-size:16px;color:var(--black);padding:0 4px 2px 4px;}
  .sign-line:focus{outline:none;background:#fffbe6;}

  .footer-row{display:flex;align-items:center;justify-content:center;gap:0;margin-top:8px;}
  .footer-diamond{width:0;height:0;border:13px solid transparent;border-bottom-color:var(--black);margin:0 -2px;}

  [contenteditable]{cursor:text;}
  [contenteditable]:hover{background:rgba(247,198,0,0.15);}
</style>
</head>

<!-- ===== TAB: EQUIPOS GUARDADOS ===== -->
<div id="tab-db" class="tab-panel">
  <div id="db-panel">
    <h2>📂 Equipos guardados</h2>
    <div id="db-status">Cargando...</div>
    <div id="teams-list"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // ===== pestañas =====
  function switchTab(tab){
    document.getElementById('tab-form').classList.toggle('active', tab==='form');
    document.getElementById('tab-db').classList.toggle('active', tab==='db');
    document.getElementById('tab-btn-form').classList.toggle('active', tab==='form');
    document.getElementById('tab-btn-db').classList.toggle('active', tab==='db');
    if(tab==='db') refreshTeamsList();
    if(tab==='form') setTimeout(fitCardToScreen, 0);
  }

  // ===== ajustar automáticamente el tamaño visual al alto de la pantalla =====
  // (esto solo escala la VISTA en pantalla; el PDF/JPG se sigue exportando
  // siempre al tamaño real de 9.8cm x 13.2cm, sin verse afectado)
  const CARD_PX_W = 945, CARD_PX_H = 1559;
  function fitCardToScreen(){
    const outer = document.getElementById('scaleOuter');
    const inner = document.getElementById('scaleInner');
    if(!outer || !inner) return;
    const rectTop = outer.getBoundingClientRect().top;
    const buffer = 20;
    const availableH = window.innerHeight - rectTop - buffer;
    const availableW = document.body.clientWidth - 20; // margen lateral
    const scaleH = availableH / CARD_PX_H;
    const scaleW = availableW / CARD_PX_W;
    const scale = Math.max(0.25, Math.min(1, Math.min(scaleH, scaleW)));
    inner.style.transform = `scale(${scale})`;
    outer.style.width = (CARD_PX_W * scale) + 'px';
    outer.style.height = (CARD_PX_H * scale) + 'px';
  }
  window.addEventListener('resize', fitCardToScreen);
  window.addEventListener('load', fitCardToScreen);
  fitCardToScreen();

  // ===== construir 10 filas editables =====
  const tbody = document.getElementById('tbody');
  for(let i=1;i<=10;i++){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><b>${i}.</b></td><td class="name-cell" contenteditable="true"></td><td contenteditable="true"></td>`;
    tbody.appendChild(tr);
  }

  // ===== Enter estilo Excel: en vez de saltar de línea, pasa a la otra columna/fila =====
  function setupExcelStyleEnter(){
    const editableCells = Array.from(document.querySelectorAll('#tbody td[contenteditable="true"]'));
    editableCells.forEach((cell, idx) => {
      cell.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          e.preventDefault(); // nunca insertar salto de línea
          const next = editableCells[idx + 1];
          if(next){ next.focus(); placeCaretAtEnd(next); }
          else { cell.blur(); }
        }
      });
    });
  }
  function placeCaretAtEnd(el){
    el.focus();
    if(typeof window.getSelection !== 'undefined' && typeof document.createRange !== 'undefined'){
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
  setupExcelStyleEnter();

  // ===== exportar =====
  const CARD_W_CM = 8.0, CARD_H_CM = 13.2;

  async function captureCanvas(){
    const inner = document.getElementById('scaleInner');
    const prevTransform = inner ? inner.style.transform : '';
    if(inner){ inner.style.transform = 'none'; void inner.offsetHeight; }
    const card = document.getElementById('card');
    let canvas;
    try{
      canvas = await html2canvas(card, {scale: 2.5, useCORS:true, backgroundColor:'#ffffff'});
    } finally {
      if(inner){ inner.style.transform = prevTransform; }
    }
    return canvas;
  }
  async function downloadJPG(){
    const canvas = await captureCanvas();
    const link = document.createElement('a');
    link.download = 'formato_leyendas_futbol.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  }
  async function downloadPDF9(){
    const canvas = await captureCanvas();
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pageW = 21.59, pageH = 27.94; // carta (letter)
    const gap = 0.3;
    const cols = 3, rows = 3;
    // tamaño máximo de tarjeta que conserva la proporción original y cabe en 3 columnas x 3 filas
    const ratio = CARD_W_CM / CARD_H_CM;
    const maxWByWidth = (pageW - (cols - 1) * gap - 1) / cols;   // 0.5cm de margen a cada lado
    const maxHByHeight = (pageH - (rows - 1) * gap - 1) / rows;  // 0.5cm de margen arriba/abajo
    let cardW = maxWByWidth, cardH = cardW / ratio;
    if (cardH > maxHByHeight) { cardH = maxHByHeight; cardW = cardH * ratio; }

    const totalW = cols * cardW + (cols - 1) * gap;
    const totalH = rows * cardH + (rows - 1) * gap;
    const marginX = (pageW - totalW) / 2;
    const marginY = (pageH - totalH) / 2;

    const pdf = new jsPDF({ orientation:'portrait', unit:'cm', format:[pageW, pageH] });
    for(let r = 0; r < rows; r++){
      for(let c = 0; c < cols; c++){
        const x = marginX + c * (cardW + gap);
        const y = marginY + r * (cardH + gap);
        pdf.addImage(imgData, 'JPEG', x, y, cardW, cardH);
      }
    }
    pdf.save('formato_leyendas_futbol_9_por_hoja.pdf');
  }

  // ===== "base de datos" de equipos guardados =====
  let storageAvailable = false;
  const memoryStore = {};

  async function storageSet(key, value){
    try{ if(window.storage){ await window.storage.set(key, value, false); storageAvailable = true; return true; } }
    catch(e){ console.debug('storage.set no disponible, usando memoria temporal', e); }
    memoryStore[key] = value; return false;
  }
  async function storageGet(key){
    try{ if(window.storage){ const r = await window.storage.get(key, false); return r ? r.value : null; } }
    catch(e){ /* no existe */ }
    return memoryStore[key] ?? null;
  }
  async function storageDelete(key){
    try{ if(window.storage){ await window.storage.delete(key, false); return; } }
    catch(e){ console.debug('storage.delete no disponible, usando memoria temporal', e); }
    delete memoryStore[key];
  }
  async function storageListKeys(prefix){
    try{ if(window.storage){ const r = await window.storage.list(prefix, false); return r ? r.keys : []; } }
    catch(e){ console.debug('storage.list no disponible, usando memoria temporal', e); storageAvailable = false; }
    return Object.keys(memoryStore).filter(k => k.startsWith(prefix));
  }

  function getFormData(){
    const rows = Array.from(document.querySelectorAll('#tbody tr')).map(tr=>{
      const tds = tr.querySelectorAll('td');
      return { nombre: tds[1].innerText.trim(), numero: tds[2].innerText.trim() };
    });
    return {
      categoria: document.getElementById('catBox').innerText.trim(),
      nombreEquipo: document.getElementById('teamNameBox').innerText.trim(),
      delegado: document.getElementById('delegadoLine').innerText.trim(),
      integrantes: rows,
      guardadoEn: new Date().toISOString()
    };
  }
  function setFormData(data){
    document.getElementById('catBox').innerText = data.categoria || 'RUMBA RUMBA';
    document.getElementById('teamNameBox').innerText = data.nombreEquipo || '';
    document.getElementById('delegadoLine').innerText = data.delegado || '';
    const trs = document.querySelectorAll('#tbody tr');
    trs.forEach((tr, i)=>{
      const tds = tr.querySelectorAll('td');
      const m = (data.integrantes && data.integrantes[i]) || {nombre:'',numero:''};
      tds[1].innerText = m.nombre || '';
      tds[2].innerText = m.numero || '';
    });
  }
  function clearForm(){
    if(!confirm('¿Vaciar todos los campos del formulario actual?')) return;
    setFormData({categoria:'RUMBA RUMBA', nombreEquipo:'', delegado:'', integrantes:[]});
  }
  async function saveCurrentTeam(){
    const data = getFormData();
    if(!data.nombreEquipo){ alert('Escribe primero el "Nombre del equipo" para poder guardarlo.'); return; }
    const id = 'team:' + data.nombreEquipo.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    await storageSet(id, JSON.stringify(data));
    alert('Equipo "' + data.nombreEquipo + '" guardado. Puedes verlo en la pestaña "Equipos guardados".');
  }
  async function loadTeam(id){
    const raw = await storageGet(id);
    if(!raw) { alert('No se pudo cargar ese equipo.'); return; }
    setFormData(JSON.parse(raw));
    switchTab('form');
  }
  async function deleteTeam(id, nombre){
    if(!confirm('¿Eliminar el equipo "' + nombre + '" de la base de datos?')) return;
    await storageDelete(id);
    await refreshTeamsList();
  }
  async function refreshTeamsList(){
    const listEl = document.getElementById('teams-list');
    const statusEl = document.getElementById('db-status');
    const keys = await storageListKeys('team:');
    statusEl.textContent = storageAvailable
      ? 'Guardado de forma persistente (disponible entre sesiones).'
      : 'Modo temporal: estos equipos solo se conservan mientras esta pestaña del navegador esté abierta.';
    if(!keys || keys.length === 0){
      listEl.innerHTML = '<div class="empty-msg">Aún no hay equipos guardados.</div>';
      return;
    }
    listEl.innerHTML = '';
    for(const key of keys){
      const raw = await storageGet(key);
      if(!raw) continue;
      const data = JSON.parse(raw);
      const row = document.createElement('div');
      row.className = 'team-row';
      const fecha = data.guardadoEn ? new Date(data.guardadoEn).toLocaleString() : '';
      row.innerHTML = `
        <div class="team-info">
          <b>${data.nombreEquipo || '(sin nombre)'}</b>
          <span>${data.categoria || ''} · ${(data.integrantes||[]).filter(m=>m.nombre).length} integrantes · ${fecha}</span>
        </div>
        <div class="team-actions">
          <button class="load-btn">Cargar / Editar</button>
          <button class="delete-btn">Eliminar</button>
        </div>`;
      row.querySelector('.load-btn').onclick = () => loadTeam(key);
      row.querySelector('.delete-btn').onclick = () => deleteTeam(key, data.nombreEquipo);
      listEl.appendChild(row);
    }
  }

  refreshTeamsList();
</script>

</body>
</html>
