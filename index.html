function wireCampRosterModal(){
  const q = sel => document.querySelector(sel);
  const qa = sel => document.querySelectorAll(sel);

  function applyFilter(){
    const search = q('#campRosterSearch');
    const v = normalizeSearch(search ? search.value : '');
    qa('[data-camp-roster-row-name]').forEach(el=>{ el.style.display = el.dataset.campRosterRowName.includes(v) ? 'flex' : 'none'; });
  }

  function refreshList(){
    const f = getCurrentFecha();
    const list = q('#campRosterList');
    if(list) list.innerHTML = campRosterListHtml(f);
    wireRows();
    applyFilter();
  }

  function wireRows(){
    qa('[data-camp-roster-name]').forEach(inp=>{
      inp.onchange = ()=>{
        const p = roster().find(x=>x.id===inp.dataset.campRosterName);
        p.name = inp.value.trim() || p.name;
        const f = getCurrentFecha();
        if(f){ f.rows.filter(r=>r.playerId===p.id).forEach(r=> r.name = p.name); }
        saveData();
      };
    });
    qa('[data-camp-roster-gk]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.campRosterGk);
        p.isGK = !p.isGK;
        saveData();
        refreshList();
      };
    });
    qa('[data-camp-roster-archive]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.campRosterArchive);
        if(p) openCampArchiveConfirm(p);
      };
    });
    qa('[data-camp-roster-restore]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.campRosterRestore);
        if(!p) return;
        p.archived = false;
        saveData();
        reopenCampRosterModal();
        showToast('Jugador restaurado ↩');
      };
    });
    qa('[data-camp-roster-hard-delete]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.campRosterHardDelete);
        if(p) openCampHardDeleteConfirm(p);
      };
    });
    qa('[data-camp-roster-convene]').forEach(btn=>{
      btn.onclick = ()=>{
        const f = getCurrentFecha();
        if(!f) return;
        const pid = btn.dataset.campRosterConvene;
        const idx = f.rows.findIndex(r=>r.playerId===pid);
        if(idx>=0){
          f.rows.splice(idx,1);
        } else {
          const rp = roster().find(p=>p.id===pid);
          if(!rp) return;
          if(!canAddToWeek(f, rp.isGK)){
            showToast(rp.isGK ? `Máximo ${MAX_GK} arqueros en la fecha` : `Máximo ${MAX_FIELD} jugadores en la fecha`);
            return;
          }
          f.rows.push(makeCampRow(rp));
        }
        saveData();
        refreshList();
      };
    });
    qa('[data-camp-roster-phone-edit]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.campRosterPhoneEdit);
        if(!p) return;
        openCampPhoneEditModal(p);
      };
    });
    qa('[data-camp-roster-wsp]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.campRosterWsp);
        sendWsp(p);
      };
    });
  }
  wireRows();

  const search = q('#campRosterSearch');
  if(search) search.oninput = applyFilter;

  let bulkQueue = [];
  let bulkIndex = 0;
  function renderBulkStep(){
    const box = q('#campBulkReminderBox');
    if(!box) return;
    if(bulkIndex >= bulkQueue.length){
      box.innerHTML = `<p style="font-size:11px;color:var(--win);text-align:center;">✅ Recordatorio enviado a los ${bulkQueue.length} convocados.</p>`;
      return;
    }
    const p = bulkQueue[bulkIndex];
    box.innerHTML = `<div style="display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:7px 8px;">
      <span style="flex:1; font-size:11px;">👉 Siguiente: <b>${escapeHtml(p.name)}</b> (${bulkIndex+1}/${bulkQueue.length})</span>
      <button class="btn btn-wsp btn-xs" id="campBulkSendStepBtn">💬 Enviar</button>
      <button class="btn btn-xs btn-outline" id="campBulkCancelBtn">✕</button>
    </div>`;
    q('#campBulkSendStepBtn').onclick = ()=>{ sendWsp(p); bulkIndex++; renderBulkStep(); };
    q('#campBulkCancelBtn').onclick = ()=>{ box.innerHTML = ''; };
  }
  const bulkBtn = q('#campBulkWspBtn');
  if(bulkBtn){
    bulkBtn.onclick = ()=>{
      const f = getCurrentFecha();
      if(!f) return;
      bulkQueue = f.rows.map(r=>roster().find(p=>p.id===r.playerId)).filter(p=>p && p.phone);
      bulkIndex = 0;
      renderBulkStep();
    };
  }

  const addBtn = q('#campRosterAddBtn');
  function addRoster(){
    const inp = q('#campRosterAddInput');
    const name = (inp.value||'').trim();
    if(!name) return;
    const isGK = q('#campRosterAddGK').checked;
    roster().push({id:uid(), name, isGK});
    saveData();
    closeModal();
    openModal(campRosterEditorModal());
    wireCampRosterModal();
  }
  if(addBtn) addBtn.onclick = addRoster;
  const addInput = q('#campRosterAddInput');
  if(addInput) addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addRoster(); } });

  const closeBtn = q('#closeCampRosterBtn');
  if(closeBtn) closeBtn.onclick = ()=>{ closeModal(); render(); };
}

/* ================= CAMPEONATO: EVENTOS ================= */
function updateCampLive(f){
  const arrived = f.rows.filter(r=>r.arrived);
  let recaudado=0, efectivo=0, nequi=0, recArb=0, recInsc=0;
  arrived.forEach(r=>{
    const deb = rowDebido(r,f);
    const dio = r.dio||0;
    recaudado += dio;
    if(r.modo==='E') efectivo += dio;
    if(r.modo==='N') nequi += dio;
    const arbPagado = Math.min(dio, deb.arbitraje);
    const inscPagado = dio - arbPagado;
    recArb += arbPagado;
    recInsc += inscPagado;
  });
  const elR = document.getElementById('campStatRecaudado');
  const elE = document.getElementById('campStatEfectivo');
  const elN = document.getElementById('campStatNequi');
  const elArb = document.getElementById('campStatRecArb');
  const elInsc = document.getElementById('campStatRecInsc');
  const elBruto = document.getElementById('campStatBruto');
  if(elR) elR.textContent = '$'+fmt(recaudado);
  if(elE) elE.textContent = '$'+fmt(efectivo);
  if(elN) elN.textContent = '$'+fmt(nequi);
  if(elArb) elArb.textContent = '$'+fmt(recArb);
  if(elInsc) elInsc.textContent = '$'+fmt(recInsc);
  if(elBruto) elBruto.textContent = '$'+fmt(recArb+recInsc);

  f.rows.forEach(r=>{
    const cell = document.getElementById('saldo-'+r.rowId);
    if(!cell) return;
    const deb = rowDebido(r,f);
    const dio = r.dio||0;
    const saldo = dio - deb.total;
    let html;
    if(!r.arrived || r.isGK) html = `<span class="vta-val pend">—</span>`;
    else if(dio===0) html = `<span class="vta-val pend">·</span>`;
    else if(saldo===0) html = `<span class="vta-val exacto">✓ ok</span>`;
    else if(saldo<0) html = `<span class="vta-val falta">-${fmtK(-saldo)}</span>`;
    else html = `<span class="vta-val devolver confirmed">+${fmtK(saldo)}</span>`;
    cell.innerHTML = html;

    const tr = document.getElementById('camprow-'+r.rowId);
    if(tr){
      let cls = r.isGK ? 'row-gk' : '';
      const complete = r.arrived && !r.isGK && saldo===0;
      const needsAction = r.arrived && !r.isGK && saldo<0;
      if(complete) cls += ' row-complete';
      else if(needsAction) cls += ' row-action';
      else if(r.arrived) cls += ' row-arrived';
      tr.className = cls;
    }
  });
}

      r.arrived = !r.arrived;
      if(!r.arrived){ r.dio=0; r.modo='E'; }
      saveData(); render();
    };
  });
  qa('[data-camp-dio]').forEach(inp=>{
    inp.oninput = ()=>{
      const f = getCurrentFecha();
      const r = f.rows.find(x=>x.rowId===inp.dataset.campDio);
      r.dio = Math.round((parseFloat(inp.value)||0)*1000);
      updateCampLive(f);
    };
    inp.onchange = ()=>{ saveData(); };
  });
  qa('[data-cycle-camp-modo]').forEach(btn=>{
    btn.onclick = ()=>{
      const f = getCurrentFecha();
      const r = f.rows.find(x=>x.rowId===btn.dataset.cycleCampModo);
      r.modo = r.modo==='' ? 'E' : r.modo==='E' ? 'N' : '';
      saveData(); render();
    };
  });

  const campQuickAddBtn = q('#campQuickAddBtn');
  function campQuickAdd(){
    const f = getCurrentFecha();
    const inp = q('#campQuickAddInput');
    const name = (inp.value||'').trim();
    if(!name) return;
    const isGK = q('#campQuickAddGK').checked;
    if(!canAddToWeek(f, isGK)){
      showToast(isGK ? `Máximo ${MAX_GK} arqueros en la fecha` : `Máximo ${MAX_FIELD} jugadores en la fecha`);
      return;
    }
    let rp = roster().find(p=>p.name.toLowerCase()===name.toLowerCase());
    if(!rp){ rp = {id:uid(), name, isGK}; roster().push(rp); }
    f.rows.push(makeCampRow(rp, {arrived:true}));
    saveData(); render();
    setTimeout(()=>{ const i=q('#campQuickAddInput'); if(i) i.focus(); }, 0);
  }
  if(campQuickAddBtn) campQuickAddBtn.onclick = campQuickAdd;
  const campQuickAddInput = q('#campQuickAddInput');
  if(campQuickAddInput) campQuickAddInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); campQuickAdd(); } });
}

function doFinishFecha(f){ f.phase='finalizado'; saveData(); render(); showToast('Fecha finalizada ✓'); }

function doFinish(w){ w.phase='finalizado'; saveData(); render(); showToast('Partido finalizado ✓'); }

function openModal(html){
  const div = document.createElement('div');
  div.innerHTML = html;
  document.body.appendChild(div.firstElementChild);
  const bg = document.getElementById('modalBg');
  if(bg) bg.addEventListener('click', (e)=>{ if(e.target.id==='modalBg'){ closeModal(); render(); } });
}
function closeModal(){ const m = document.getElementById('modalBg'); if(m) m.remove(); }

// Si el usuario usa el botón/gesto de atrás del sistema (Android/navegador),
// navegamos dentro de la app en vez de cerrarla o recargarla.
window.addEventListener('popstate', ()=>{
  if(navStack.length>0) goBack();
});

/* ---------- INIT ---------- */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:70px;"><span class="ico">⚽</span><p>Cargando...</p></div>`;
  await loadData();
  try{ history.replaceState({ navDepth: 0 }, ''); }catch(e){}
  render();
})();
</script>
