<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fútbol ⚽</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a120b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a120b;
    --surface:#161B22;
    --surface-2:#1E2530;
    --surface-3:#272F3D;
    --line: rgba(255,255,255,0.12);
    --line-soft: rgba(255,255,255,0.06);
    --chalk:#F5F6F2;
    --chalk-dim:#93A0A8;
    --gold:#FFC94D;
    --gold-dim:#9c7a2c;
    --win:#37D67A;
    --win-bg: rgba(55,214,122,0.15);
    --lose:#FF5C5C;
    --lose-bg: rgba(255,92,92,0.15);
    --danger:#FF5C5C;
    --grass-1:#1f7a34;
    --grass-2:#1a6b2c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, rgba(6,10,7,0.90), rgba(6,10,7,0.97) 220px, var(--bg) 420px),
      repeating-linear-gradient(90deg, var(--grass-1) 0 42px, var(--grass-2) 42px 84px);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:56px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 12px;}

  .col-arb{ width:30px; }
  .col-insc{ width:32px; }
  .col-total{ width:34px; }

  .mode-switch{ display:flex; gap:6px; margin-bottom:8px; }
  .mode-switch button{
    flex:1; font-family:'JetBrains Mono'; font-weight:700; font-size:10.5px; letter-spacing:0.3px;
    text-transform:uppercase; padding:8px 4px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--chalk-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .mode-switch button.active{ background:rgba(255,201,77,0.14); border-color:var(--gold); color:var(--gold); }

  .back-bar{ display:flex; align-items:center; margin-bottom:8px; min-height:32px; }
  .back-btn{
    width:32px; height:32px; border-radius:50%; padding:0; flex:0 0 auto;
    border:1px solid var(--line); background:var(--surface); color:var(--gold);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .back-btn svg{ width:17px; height:17px; display:block; }
  .back-btn:active{ transform:scale(0.92); background:var(--surface-2); }

  .camp-selector-bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:8px 11px; margin-bottom:8px; cursor:pointer;
  }
  .camp-selector-bar .csb-name{ font-weight:700; font-size:12.5px; color:var(--gold); }
  .camp-selector-bar .csb-chevron{ font-size:11px; color:var(--chalk-dim); font-family:'JetBrains Mono'; }

  .topline{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:5px;}
  .mini-title{
    flex:1; text-align:center; font-family:'Anton',sans-serif; font-weight:400;
    font-size:9.5px; line-height:1.1; letter-spacing:0.4px; text-transform:uppercase; color:var(--gold);
  }

  .tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:#0a0f0aee; backdrop-filter:blur(8px); border-top:1px solid var(--line);
    display:flex; z-index:50;
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--chalk-dim);
    font-size:10px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase;
    padding:6px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
  }
  .tabbar button .ico{font-size:15px; line-height:1;}
  .tabbar button.active{color:var(--gold);}

  .content{padding:6px 8px 8px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;}
  .card h2{font-family:'Anton'; font-weight:400; text-transform:uppercase; font-size:15px; letter-spacing:0.4px; margin:0 0 8px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .eyebrow{font-family:'JetBrains Mono'; font-size:10px; color:var(--gold); letter-spacing:1.4px; text-transform:uppercase; font-weight:700; margin:0;}

  .btn{font-family:'Inter'; font-weight:700; font-size:12.5px; border-radius:9px; border:1px solid var(--line); padding:7px 14px; cursor:pointer; background:var(--surface-2); color:var(--chalk); display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:var(--gold); color:#1c1204; border:none;}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--chalk-dim);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(194,91,74,0.4);}
  .btn-block{width:100%;}
  .btn-xs{padding:5px 9px; font-size:11px; border-radius:7px;}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}

  input[type=text], input[type=number], input[type=date]{
    background:var(--surface-2); border:1px solid var(--line); color:var(--chalk);
    border-radius:8px; padding:8px 10px; font-family:'Inter'; font-size:13px;
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  input:disabled{opacity:0.4;}

  .phase-chip{font-family:'JetBrains Mono'; font-size:10px; letter-spacing:1px; text-transform:uppercase; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block; margin-top:2px;}
  .phase-armando{background:var(--surface-3); color:var(--chalk-dim); border:1px solid var(--line);}
  .phase-jugando{background:rgba(227,167,62,0.16); color:var(--gold); border:1px solid var(--gold-dim);}
  .phase-finalizado{background:var(--win-bg); color:var(--win); border:1px solid var(--win);}

  /* stat strip */
  .stats-strip{display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px;}
  .stat-chip{
    flex:0 0 auto; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:6px 10px; text-align:center; min-width:64px;
  }
  .stat-chip .slabel{font-size:9px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.4px; font-weight:700;}
  .stat-chip .sval{font-family:'JetBrains Mono'; font-weight:700; font-size:14px; margin-top:1px;}
  .stat-chip.gold .sval{color:var(--gold);}
  .stat-chip.win .sval{color:var(--win);}
  .stat-chip.warn .sval{color:var(--lose);}

  /* SPREADSHEET TABLE */
  .sheet-wrap{
    border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface);
  }
  .sheet-scroll{
    overflow-x:auto; overflow-y:auto; max-height:66vh; max-height:calc(100vh - 178px); max-height:calc(100dvh - 178px);
    -webkit-overflow-scrolling:touch;
  }
  table.sheet{ border-collapse:separate; border-spacing:0; width:100%; font-size:11px; table-layout:fixed; }
  table.sheet thead th{
    position:sticky; top:0; z-index:3;
    background:#10151c; color:var(--gold); font-family:'JetBrains Mono'; font-weight:700;
    font-size:9px; text-transform:uppercase; letter-spacing:0.3px;
    padding:5px 3px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.sheet thead th.th-name{ text-align:left; padding-left:8px; }
  table.sheet td{ padding:4px 3px; text-align:center; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  table.sheet tbody tr:hover td{ background:rgba(255,255,255,0.02); }

  .col-num{ width:16px; }
  .col-name{ width:120px; text-align:left !important; padding-left:8px !important; max-width:120px; }
  .col-ll{ width:22px; }
  .col-gp{ width:24px; }
  .col-pago{ width:32px; }
  .col-dio{ width:42px; }
  .col-vta{ width:38px; }
  .col-md{ width:20px; }

  .sticky-col{ position:sticky; left:0; z-index:2; background:var(--surface); }
  table.sheet thead th.sticky-col{ z-index:4; background:#10151c; }
  tr.row-gk .sticky-col{ background:#22271a; }
  tr.row-gk:hover .sticky-col{ background:#282e1f; }
  tr.row-arrived .sticky-col{ background:#1a2029; }
  tr.row-complete td{ background: rgba(55,214,122,0.07); }
  tr.row-complete .sticky-col{ background: #172219; }
  tr.row-action .sticky-col{ background:#2b2314; }
  tr.row-action td{ background: rgba(255,201,77,0.06); }

  .rownum{ font-family:'JetBrains Mono'; font-size:9px; color:var(--chalk-dim); }
  .gk-tag{ font-size:12px; }
  .rname{ font-weight:600; font-size:11px; line-height:1.2; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:116px; }
  .rname .sub{display:block; font-size:9px; color:var(--chalk-dim); font-weight:500;}

  .cell-btn{
    width:19px; height:19px; border-radius:5px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--chalk-dim); font-weight:800; font-size:9px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    padding:0;
  }
  .cell-btn:disabled{ opacity:0.25; cursor:not-allowed; }
  .cell-btn.ll-on{ background:var(--win); border-color:var(--win); color:#0a1f10; }
  .cell-btn.gp-win{ background:var(--win-bg); border-color:var(--win); color:var(--win); }
  .cell-btn.gp-lose{ background:var(--lose-bg); border-color:var(--lose); color:var(--lose); }
  .cell-btn.md-e{ background:var(--surface-3); border-color:var(--gold-dim); color:var(--gold); }
  .cell-btn.md-n{ background:rgba(140,120,220,0.16); border-color:#8c78dc; color:#b3a4ec; }

  .pago-val{ font-family:'JetBrains Mono'; font-size:9px; color:var(--chalk-dim); }
  .dio-input{
    width:36px; text-align:right; padding:2px 3px; font-family:'JetBrains Mono'; font-size:9.5px;
  }
  .dio-input::-webkit-outer-spin-button, .dio-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .vta-val{ font-family:'JetBrains Mono'; font-weight:700; font-size:9px; cursor:default; }
  .vta-val.devolver{ color:var(--gold); cursor:pointer; text-decoration:underline dotted; }
  .vta-val.devolver.confirmed{ color:var(--win); text-decoration:none; }
  .vta-val.falta{ color:var(--lose); }
  .vta-val.exacto{ color:var(--win); }
  .vta-val.pend{ color:var(--chalk-dim); }

  .section-row td{
    background:#10151c; color:var(--gold); font-family:'JetBrains Mono'; font-weight:700; font-size:9.5px;
    text-transform:uppercase; letter-spacing:1px; text-align:left; padding:4px 7px; border-bottom:1px solid var(--line);
  }
  .section-row .sticky-col{ background:#10151c; }

  /* add row form */
  .add-strip{ display:flex; gap:5px; padding:6px; border-top:1px solid var(--line); background:var(--surface-2); align-items:center; flex-wrap:wrap; }
  .add-strip input[type=text]{ flex:1; min-width:100px; padding:6px 8px; }
  .gk-check{ display:flex; align-items:center; gap:4px; font-size:10px; color:var(--chalk-dim); white-space:nowrap; }
  .gk-check input{ width:14px; height:14px; }

  .empty{text-align:center; padding:28px 16px; color:var(--chalk-dim);}
  .empty .ico{font-size:30px; display:block; margin-bottom:6px; opacity:0.6;}
  .empty p{margin:0 0 12px; font-size:13px;}

  .legend{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; font-size:10px; color:var(--chalk-dim); }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  .modal-bg{position:fixed; inset:0; background:rgba(6,15,10,0.75); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:16px 16px 0 0; width:100%; max-width:560px; padding:16px 14px 22px; max-height:88vh; overflow-y:auto;}
  .modal h3{font-family:'Anton'; text-transform:uppercase; font-size:16px; margin:0 0 8px;}
  .modal p{font-size:13px; color:var(--chalk-dim); margin:0 0 12px;}
  .modal-actions{display:flex; gap:8px; margin-top:14px;}
  .roster-row{ display:flex; align-items:center; gap:5px; padding:6px 0; border-bottom:1px solid var(--line); }
  .picker-group-label{ font-family:'JetBrains Mono'; font-size:9.5px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:var(--gold); padding:10px 0 4px; }
  .picker-group-label:first-child{ padding-top:0; }
  .roster-row input[type=text]{ flex:1; min-width:0; padding:6px 7px; font-size:12.5px; }
  .roster-row .btn-xs{ flex:0 0 auto; padding:5px 7px; font-size:10.5px; white-space:nowrap; }
  .roster-row .btn-icon{ flex:0 0 auto; padding:5px 6px; font-size:11px; min-width:26px; }
  .btn-wsp{ background:#25D366; border-color:#25D366; color:#062b13; font-weight:800; }
  .btn-wsp:disabled{ opacity:0.35; cursor:not-allowed; }

  .toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--win); color:var(--win); padding:8px 14px; border-radius:30px; font-size:12.5px; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .toast.show{opacity:1;}

  .hist-item{display:flex; align-items:center; gap:12px; padding:11px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2); margin-bottom:8px; cursor:pointer;}
  .hist-date{font-family:'Anton'; font-size:20px; line-height:1; color:var(--chalk); width:48px; text-align:center;}
  .hist-date .dow{font-family:'JetBrains Mono'; font-size:8.5px; color:var(--gold); display:block; letter-spacing:1px; margin-bottom:2px;}
  .hist-info{flex:1;}
  .hist-info .hmain{font-weight:700; font-size:13.5px;}
  .hist-info .hsub{font-size:11.5px; color:var(--chalk-dim);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const DOW = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const PRICE_WIN = 8000;
const PRICE_LOSE = 12500;

const DEFAULT_ROSTER = [
  {name:"Daniel Taca", isGK:true},
  {name:"Yeider", isGK:true},
  {name:"Eduardo", isGK:false},
  {name:"Brayan", isGK:false},
  {name:"Daniel Taca Pa", isGK:false},
  {name:"Andrés Susuki", isGK:false},
  {name:"Ronaldo", isGK:false},
  {name:"Yancarlos", isGK:false},
  {name:"Edinson", isGK:false},
  {name:"Dayro", isGK:false},
  {name:"Lucho", isGK:false},
  {name:"Ciro", isGK:false},
  {name:"José Andrés", isGK:false},
  {name:"Maluma", isGK:false},
  {name:"Deiner", isGK:false},
  {name:"Deiner Amigo", isGK:false},
  {name:"Wilfran", isGK:false},
  {name:"LeideR", isGK:false},
];

const MODE_INFO = {
  sabado: {
    key: 'sabado',
    tabIcon: '🗓️',
    tabLabel: 'Sábados',
    titleHtml: '⚽ SÁBADOS<br>DE FÚTBOL ⚽',
    newBtnLabel: '+ Nuevo sábado',
    emptyMsg: 'No hay partido activo. Crea el del próximo sábado.',
    dateLabel: 'Fecha del sábado',
    defaultHora: '14:00',
    defaultLugar: 'Torres'
  },
  semana: {
    key: 'semana',
    tabIcon: '🏆',
    tabLabel: 'Campeonato',
    titleHtml: '🏆 CAMPEONATO<br>ENTRE SEMANA 🏆',
    newBtnLabel: '+ Nueva fecha',
    emptyMsg: 'No hay fecha activa. Crea la próxima fecha del campeonato.',
    dateLabel: 'Datos de la fecha',
    defaultHora: '20:00',
    defaultLugar: 'El Peñón'
  }
};

let state = { data: { sabado: { roster: [], weeks: [] }, semana: { campeonatos: [], activeId: null } } };
let mode = "sabado";
let tab = "sabado";
let campTab = "fechas";
let historyViewId = null;
let navStack = [];

// ---- Navegación "Atrás" (mantiene el estado de la app, sin recargar) ----
function snapshotNav(){ return { mode, tab, campTab, historyViewId }; }
function pushNav(){
  navStack.push(snapshotNav());
  try{ history.pushState({ navDepth: navStack.length }, ''); }catch(e){}
}
function goBack(){
  if(navStack.length===0) return;
  const prev = navStack.pop();
  mode = prev.mode; tab = prev.tab; campTab = prev.campTab; historyViewId = prev.historyViewId;
  render();
}
const BACK_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;

function modeInfo(){ return MODE_INFO[mode]; }
function data(){ return state.data[mode]; }
function roster(){
  if(mode==='semana'){
    const c = activeCampeonato();
    return c ? c.roster : [];
  }
  return data().roster;
}
function semanaData(){ return state.data.semana; }
function activeCampeonato(){
  const sd = semanaData();
  if(!sd.campeonatos || sd.campeonatos.length===0) return null;
  return sd.campeonatos.find(c=>c.id===sd.activeId) || sd.campeonatos[0];
}
function newCampeonato(nombre){
  const sd = semanaData();
  const c = { id: uid(), nombre: (nombre||'').trim() || `Campeonato ${sd.campeonatos.length+1}`, roster: [], config: null, fechas: [] };
  sd.campeonatos.push(c);
  sd.activeId = c.id;
  return c;
}
function weeksArr(){ return data().weeks; }
function setWeeksArr(arr){ data().weeks = arr; }

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const MAX_GK = 2;
const MAX_FIELD = 16;
function countWeekGK(w, excludeRowId){ return w.rows.filter(r=>r.isGK && r.rowId!==excludeRowId).length; }
function countWeekField(w, excludeRowId){ return w.rows.filter(r=>!r.isGK && r.rowId!==excludeRowId).length; }
function canAddToWeek(w, isGK){
  if(!w) return true;
  return isGK ? countWeekGK(w) < MAX_GK : countWeekField(w) < MAX_FIELD;
}

const fmt = n => (Math.round(n||0)).toLocaleString('es-CO');
const fmtMiles = n => {
  const v = (n||0)/1000;
  return (v % 1 === 0) ? String(v) : String(v.toFixed(1));
};
const fmtK = n => {
  n = Math.round(n||0);
  if(n===0) return '0';
  if(n % 1000 === 0) return (n/1000) + 'k';
  return (n/1000).toFixed(1).replace('.0','') + 'k';
};

const STORAGE_KEY = 'futbol-data-v3';
const hasClaudeStorage = () => (typeof window.storage !== 'undefined' && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasClaudeStorage()){
    try{ const res = await window.storage.get(key, false); if(res && res.value) return res.value; }
    catch(e){ /* fall through to localStorage */ }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let ok = false;
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); ok = true; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key, value); ok = true; }catch(e){ /* ignore */ }
  return ok;
}

function ensureWeekDefaults(w, modeKey){
  const info = MODE_INFO[modeKey] || MODE_INFO.sabado;
  if(!w.hora) w.hora = info.defaultHora;
  if(!w.lugar) w.lugar = info.defaultLugar;
}

async function loadData(){
  try{
    const raw = await storageGet(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      let sabadoPart;

      // ---- Sábados: nunca cambia su formato (roster + weeks) ----
      if(parsed && parsed.data && parsed.data.sabado){
        sabadoPart = parsed.data.sabado;
      } else if(parsed && (parsed.roster || parsed.weeks)){
        // Formato antiguo de una sola cancha (previo a los modos)
        sabadoPart = { roster: parsed.roster || [], weeks: parsed.weeks || [] };
      } else {
        sabadoPart = { roster: DEFAULT_ROSTER.map(p=>({id:uid(), ...p})), weeks: [] };
      }
      if(!Array.isArray(sabadoPart.roster)) sabadoPart.roster = [];
      if(!Array.isArray(sabadoPart.weeks)) sabadoPart.weeks = [];
      sabadoPart.weeks.forEach(w=>ensureWeekDefaults(w,'sabado'));

      // ---- Entre semana: uno o más campeonatos (cada uno con su roster + config + fechas) ----
      const oldSemana = (parsed && parsed.data && parsed.data.semana) ? parsed.data.semana : null;
      let semanaCampeonatos, semanaActiveId;

      function normalizeCampeonato(c, nombreDefault){
        const camp = {
          id: c.id || uid(),
          nombre: c.nombre || nombreDefault,
          roster: Array.isArray(c.roster) ? c.roster : [],
          config: c.config || null,
          fechas: Array.isArray(c.fechas) ? c.fechas : []
        };
        camp.fechas.forEach(f=>{
          ensureWeekDefaults(f,'semana');
          if(f.rival===undefined) f.rival = '';
          if(f.resultado===undefined) f.resultado = null;
          if(f.golesFavor===undefined) f.golesFavor = 0;
          if(f.golesContra===undefined) f.golesContra = 0;
        });
        if(camp.config && !camp.config.nombreEquipo) camp.config.nombreEquipo = 'Banda del Rey';
        return camp;
      }

      if(oldSemana && Array.isArray(oldSemana.campeonatos)){
        // Ya está en formato multi-campeonato
        semanaCampeonatos = oldSemana.campeonatos.map((c,i)=>normalizeCampeonato(c, `Campeonato ${i+1}`));
        semanaActiveId = oldSemana.activeId && semanaCampeonatos.some(c=>c.id===oldSemana.activeId)
          ? oldSemana.activeId : (semanaCampeonatos[0] ? semanaCampeonatos[0].id : null);
      } else if(oldSemana && Array.isArray(oldSemana.fechas)){
        // Formato de un solo campeonato -> se convierte en el primero de la lista
        const camp = normalizeCampeonato(oldSemana, 'Campeonato 1');
        semanaCampeonatos = [camp];
        semanaActiveId = camp.id;
      } else if(oldSemana){
        // Formato aún más antiguo (partido normal tipo sábado) -> se conserva el plantel
        const camp = normalizeCampeonato({ roster: oldSemana.roster }, 'Campeonato 1');
        semanaCampeonatos = [camp];
        semanaActiveId = camp.id;
      } else {
        const camp = normalizeCampeonato({}, 'Campeonato 1');
        semanaCampeonatos = [camp];
        semanaActiveId = camp.id;
      }
      const semanaPart = { campeonatos: semanaCampeonatos, activeId: semanaActiveId };

      state = { data: { sabado: sabadoPart, semana: semanaPart } };
      return;
    }
    throw new Error('no data');
  }catch(e){
    const camp = { id: uid(), nombre: 'Campeonato 1', roster: [], config: null, fechas: [] };
    state = { data: {
      sabado: { roster: DEFAULT_ROSTER.map(p=>({id:uid(), ...p})), weeks: [] },
      semana: { campeonatos: [camp], activeId: camp.id }
    } };
    await saveData();
  }
}
async function saveData(){
  const ok = await storageSet(STORAGE_KEY, JSON.stringify(state));
  if(!ok) showToast('No se pudo guardar ⚠️');
}

function showToast(msg){

function fmtHora12(hhmm){
  if(!hhmm) return '';
  const parts = String(hhmm).split(':');
  let h = parseInt(parts[0],10)||0;
  const m = parseInt(parts[1],10)||0;
  const period = h>=12 ? 'pm' : 'am';
  let h12 = h % 12; if(h12===0) h12 = 12;
  return m===0 ? `${h12} ${period}` : `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDateLong(iso){ const d = new Date(iso+"T12:00:00"); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateShort(iso){ const d = new Date(iso+"T12:00:00"); return { dow: DOW[d.getDay()], num: d.getDate(), mon: MONTHS[d.getMonth()] }; }

/* ================= CAMPEONATO (modo Entre semana) ================= */
function campConfig(){ const c = activeCampeonato(); return c ? c.config : null; }
function campFechas(){ const c = activeCampeonato(); return c ? c.fechas : []; }
function setCampFechas(arr){ const c = activeCampeonato(); if(c) c.fechas = arr; }

function getCurrentFecha(){
  return campFechas().find(f=>f.phase!=='finalizado') || null;
}
function activeFecha(){
  return historyViewId ? campFechas().find(x=>x.id===historyViewId) : getCurrentFecha();
}
function fechaIndex(f){ return campFechas().findIndex(x=>x.id===f.id); }

function makeCampRow(rp, opts={}){
  return { rowId: uid(), playerId: rp.id, name: rp.name, isGK: !!rp.isGK, arrived: !!opts.arrived, dio:0, modo:'E' };
}

  saveData(); render();
}

function roundUpTo(value, increment){
  increment = increment || 500;
  if(value<=0) return 0;
  return Math.ceil(value/increment)*increment;
}

function campFieldArrived(f){ return f.rows.filter(r=>r.arrived && !r.isGK); }
function campGkArrived(f){ return f.rows.filter(r=>r.arrived && r.isGK); }

// La inscripción se reparte entre TODOS los jugadores de campo del plantel del campeonato
// (asistan o no ese día puntual), no solo entre los que llegaron a una fecha específica.
// Si entra un jugador nuevo, la cuota de todos se reajusta automáticamente porque este
// cálculo siempre se hace en vivo con el tamaño actual del plantel.
function campFieldRosterCount(){
  return roster().filter(p=>!p.isGK && !p.archived).length;
}
// Cuánto le corresponde a cada jugador en TOTAL durante todo el campeonato
function campPlayerInscripcionQuota(){
  const cfg = campConfig();
  if(!cfg) return 0;
  const n = campFieldRosterCount();
  if(n===0) return 0;
  return cfg.inscripcionTotal / n;
}
// Cuota fija por fecha (la misma para todos los jugadores de campo, sin importar
// cuántos hayan llegado ese día específico)
function campPlayerInscripcionInstallment(){
  const cfg = campConfig();
  if(!cfg) return 0;
  const quota = campPlayerInscripcionQuota();
  if(quota<=0) return 0;
  return roundUpTo(quota / cfg.numFechas, cfg.redondeo);
}

// Insc: cuota fija por fecha (no depende de la fecha en sí, es la misma para todo el plantel)
function fechaInscripcionPorJugador(f){
  return campPlayerInscripcionInstallment();
}
// Arbitraje: se sigue dividiendo solo entre quienes llegaron ESE día. No lleva registro
// histórico -- se recoge y se paga el mismo día, punto.
function fechaArbitrajePorJugador(f){
  const cfg = campConfig();
  if(!cfg) return 0;
  const field = campFieldArrived(f);
  if(field.length===0) return 0;
  return roundUpTo(cfg.arbitraje / field.length, cfg.redondeo);
}

// Lo que debe pagar un jugador puntual en una fecha puntual
function rowDebido(r, f){
  if(!r.arrived || r.isGK) return { arbitraje:0, inscripcion:0, total:0 };
  const arb = fechaArbitrajePorJugador(f);
  const insc = fechaInscripcionPorJugador(f);
  return { arbitraje: arb, inscripcion: insc, total: arb+insc };
}
function rowSaldo(r, f){
  const deb = rowDebido(r, f);
  return (r.dio||0) - deb.total;
}

// Totales y tabla financiera del campeonato completo
function resultBadgeHtml(f){
  if(!f.resultado) return '';
  const map = { G: {txt:'Ganó', color:'var(--win)'}, P: {txt:'Perdió', color:'var(--lose)'}, E: {txt:'Empató', color:'var(--gold)'} };
  const r = map[f.resultado];
  if(!r) return '';
  const marcador = `${f.golesFavor||0}-${f.golesContra||0}`;
  return ` <span style="font-weight:700; color:${r.color};">${r.txt} ${marcador}</span>`;
}
function campEquipoNombre(){
  const cfg = campConfig();
  return (cfg && cfg.nombreEquipo) || 'Banda del Rey';
}
function campMarcadorLine(f){
  if(!f.rival) return '';
  const equipo = campEquipoNombre();
  if(f.resultado){
    const map = { G:'var(--win)', P:'var(--lose)', E:'var(--gold)' };
    const color = map[f.resultado] || 'var(--chalk-dim)';
    return `<b>${escapeHtml(equipo)}</b> <span style="color:${color}; font-weight:800;">${f.golesFavor||0} - ${f.golesContra||0}</span> ${escapeHtml(f.rival)}`;
  }
  return `<b>${escapeHtml(equipo)}</b> vs ${escapeHtml(f.rival)}`;
}

function campMatchStats(){
  const fechas = campFechas().filter(f=>f.phase==='finalizado' && f.resultado);
  let g=0,p=0,e=0,gf=0,gc=0;
  fechas.forEach(f=>{
    if(f.resultado==='G') g++;
    else if(f.resultado==='P') p++;
    else if(f.resultado==='E') e++;
    gf += f.golesFavor||0;
    gc += f.golesContra||0;
  });
  const puntos = g*2 + e*1;
  return { jugados: fechas.length, g, p, e, puntos, gf, gc, dg: gf-gc };
}

function campTotals(){
  const cfg = campConfig();
  const fechas = campFechas();
  const players = {};
  roster().forEach(p=>{ players[p.id] = { id:p.id, name:p.name, isGK:!!p.isGK, archived:!!p.archived, insc:0, fechasJugadas:0 }; });

  let inscripcionRecaudadaTotal = 0;

  fechas.forEach(f=>{
    if(!cfg) return;
    const arbPer = fechaArbitrajePorJugador(f);
    f.rows.forEach(r=>{
      if(!r.arrived || r.isGK) return;
      const dio = r.dio||0;
      // El arbitraje se cobra primero (es del día, no lleva registro), el resto va a inscripción
      const aporteInsc = Math.max(0, dio - arbPer);
      const pl = players[r.playerId];
      if(pl){
        pl.insc += aporteInsc;
        pl.fechasJugadas += 1;
      }
      inscripcionRecaudadaTotal += aporteInsc;
    });
  });

  const quota = campPlayerInscripcionQuota();
  const installment = campPlayerInscripcionInstallment();

  Object.values(players).forEach(pl=>{
    if(pl.isGK){ pl.leToca = 0; pl.debeInsc = 0; return; }
    if(pl.archived){
      // Jugador archivado: ya no se le carga cuota nueva ni se le reparte lo que falte,
      // pero se conserva lo que ya dio para que la plata recaudada nunca desaparezca del historial.
      pl.leToca = 0; pl.debeInsc = 0; return;
    }
    // "Le toca" muestra la cuota TOTAL de inscripción que le corresponde a cada jugador
    // (inscripción total del campeonato repartida entre el plantel de campo ACTIVO).
    pl.leToca = quota;
    pl.debeInsc = pl.leToca - pl.insc;
  });

  const inscripcionTotal = cfg ? cfg.inscripcionTotal : 0;
  const inscripcionPendienteTotal = Math.max(0, inscripcionTotal - inscripcionRecaudadaTotal);
  const fechasJugadas = fechas.filter(f=>f.phase==='finalizado').length;
  const fechasRestantes = cfg ? Math.max(0, cfg.numFechas - fechasJugadas) : 0;
  const numJugadoresCampo = campFieldRosterCount();
  const excedente = cfg ? Math.max(0, (installment*cfg.numFechas*numJugadoresCampo) - inscripcionTotal) : 0;

  return {
    players: Object.values(players),
    excedente, inscripcionRecaudadaTotal, inscripcionPendienteTotal,
    inscripcionTotal, fechasJugadas, fechasRestantes,
    cuotaPorJugador: quota, cuotaPorFecha: installment, numJugadoresCampo
  };
}


/* ---------- payment calc ---------- */
function calcOwed(r){
  if(!r.arrived) return null;
  if(r.won===true) return PRICE_WIN;
  if(r.won===false) return PRICE_LOSE;
  return null;
}
function paymentStatus(r){
  const owed = calcOwed(r);
  if(owed===null) return {state:'sin-resultado', owed:0, dio:r.dio||0, delta:0};
  const dio = r.dio||0;
  if(dio<=0) return {state:'pendiente', owed, dio:0, delta:0};
  if(dio===owed) return {state:'exacto', owed, dio, delta:0};
  if(dio>owed) return {state:'devolver', owed, dio, delta: dio-owed};
  return {state:'falta', owed, dio, delta: owed-dio};
}
function rowIsComplete(r){
  if(!r.arrived) return false;
  const st = paymentStatus(r);
  if(st.state==='exacto') return true;
  if(st.state==='devolver') return !!r.vueltoConfirmado;
  return false;
}
function rowNeedsAction(r){
  if(!r.arrived) return false;
  const st = paymentStatus(r);
  if(st.state==='falta') return true;
  if(st.state==='devolver' && !r.vueltoConfirmado) return true;
  return false;
}

function phaseLabel(phase){ return phase==='armando' ? 'Armando lista' : phase==='jugando' ? 'En juego' : 'Finalizado'; }

function renderSabado(){
  const w = activeWeek();
  const readOnly = !!historyViewId;
  const info = modeInfo();

  if(!w){
    return `<div class="empty"><span class="ico">⚽</span><p>${info.emptyMsg}</p>
      <button class="btn btn-gold" id="newWeekBtn">${info.newBtnLabel}</button></div>`;
  }

  let html = '';
  if(readOnly){
    const currentActive = getCurrentWeek();
    const canReopen = w.phase==='finalizado' && !currentActive;
    html += `<div class="row" style="gap:8px; margin-bottom:10px;">
      <button class="btn btn-outline btn-block" id="backToCurrentBtn">${currentActive ? '← Volver al partido actual' : '← Volver al historial'}</button>
      ${canReopen ? `<button class="btn btn-gold" id="reopenWeekBtn" style="flex:0 0 auto;">↺ Reabrir</button>` : ''}
      <button class="btn btn-danger" id="deleteThisWeekBtn" style="flex:0 0 auto;">🗑</button>
    </div>`;
    if(w.phase==='finalizado' && currentActive){
      html += `<div class="empty" style="padding:6px 0 14px;"><p style="margin:0;">Tienes otro partido activo. Termínalo antes de reabrir este.</p></div>`;
    }
  }

  html += `<div class="topline">
    <div>
      <div class="eyebrow">${fmtDateLong(w.date)}</div>
      <div style="font-size:11px; color:var(--chalk-dim); margin-top:2px;">🕒 ${fmtHora12(w.hora||info.defaultHora)} · 📍 ${escapeHtml(w.lugar||info.defaultLugar)}</div>
      <span class="phase-chip phase-${w.phase}">${phaseLabel(w.phase)}</span>
    </div>
    <div class="mini-title">${info.titleHtml}</div>
    <div style="display:flex; gap:6px;">
      ${!readOnly ? `<button class="btn btn-outline btn-xs" id="changeDateBtn">📅</button>` : ''}
      ${!readOnly ? `<button class="btn btn-outline btn-xs" id="editRosterBtn">✎ Plantel</button>` : ''}
    </div>
  </div>`;

  const cellsLocked = w.phase !== 'jugando';
  const showAdd = !readOnly;
  const arrived = w.rows.filter(r=>r.arrived);

  if(w.phase==='jugando' && arrived.length>0){
    let recaudado=0, efectivo=0, nequi=0, pendientes=0;
    arrived.forEach(r=>{
      const st = paymentStatus(r);
      recaudado += Math.min(st.dio, st.owed);
      if(r.modo==='E') efectivo += Math.min(st.dio, st.owed);
      if(r.modo==='N') nequi += Math.min(st.dio, st.owed);
      if(rowNeedsAction(r) || st.state==='pendiente' || st.state==='sin-resultado') pendientes++;
    });
    html += `<div class="stats-strip">
      <div class="stat-chip gold"><div class="slabel">Recaudado</div><div class="sval">$${fmt(recaudado)}</div></div>
      <div class="stat-chip"><div class="slabel">Llegaron</div><div class="sval">${arrived.length}/${w.rows.length}</div></div>
      <div class="stat-chip win"><div class="slabel">Efectivo</div><div class="sval">$${fmt(efectivo)}</div></div>
      <div class="stat-chip win"><div class="slabel">Nequi</div><div class="sval">$${fmt(nequi)}</div></div>
      <div class="stat-chip ${pendientes>0?'warn':''}"><div class="slabel">Pendientes</div><div class="sval">${pendientes}</div></div>
    </div>`;
  }

  html += renderSheet(w, cellsLocked || readOnly, showAdd);

  if(!readOnly){
    if(w.phase==='armando'){
      html += `<button class="btn btn-gold btn-block" id="startGameBtn" style="margin-top:6px;" ${w.rows.length===0?'disabled':''}>▶ Iniciar juego</button>`;
    } else if(w.phase==='jugando'){
      html += `<button class="btn btn-gold btn-block" id="finishGameBtn" style="margin-top:6px;">🏁 Finalizar juego</button>`;
    }
  }

  return html;
}

function renderSheet(w, cellsLocked, showAdd){
  const gkRows = w.rows.filter(r=>r.isGK);
  const fieldRows = w.rows.filter(r=>!r.isGK);

  function rowHtml(r, num, icon){
    const st = paymentStatus(r);
    const complete = rowIsComplete(r);
    const needsAction = rowNeedsAction(r);
    let trClass = r.isGK ? 'row-gk' : '';
    if(complete) trClass += ' row-complete';
    else if(needsAction) trClass += ' row-action';
    else if(r.arrived) trClass += ' row-arrived';

    let vtaHtml = '';
    if(st.state==='sin-resultado') vtaHtml = `<span class="vta-val pend">—</span>`;
    else if(st.state==='pendiente') vtaHtml = `<span class="vta-val pend">·</span>`;
    else if(st.state==='exacto') vtaHtml = `<span class="vta-val exacto">✓ ok</span>`;
    else if(st.state==='falta') vtaHtml = `<span class="vta-val falta">-${fmtK(st.delta)}</span>`;
    else if(st.state==='devolver'){
      if(r.vueltoConfirmado) vtaHtml = `<span class="vta-val devolver confirmed" data-toggle-vuelto="${r.rowId}">✓ dado</span>`;
      else vtaHtml = `<span class="vta-val devolver" data-toggle-vuelto="${r.rowId}">+${fmtK(st.delta)}</span>`;
    }

    return `<tr class="${trClass}">
      <td class="col-num sticky-col"><span class="rownum">${num}.</span></td>
      <td class="col-name sticky-col"><span class="rname">${icon} ${escapeHtml(r.name)}</span></td>
      <td class="col-ll"><button class="cell-btn ${r.arrived?'ll-on':''}" data-toggle-arrived="${r.rowId}" ${cellsLocked?'disabled':''}>${r.arrived?'✓':''}</button></td>
      <td class="col-gp"><button class="cell-btn ${r.won===true?'gp-win':r.won===false?'gp-lose':''}" data-cycle-won="${r.rowId}" ${cellsLocked||!r.arrived?'disabled':''}>${r.won===true?'G':r.won===false?'P':'—'}</button></td>
      <td class="col-pago"><span class="pago-val">${st.owed?fmtK(st.owed):'—'}</span></td>
      <td class="col-dio"><input type="number" min="0" step="0.5" class="dio-input" data-dio="${r.rowId}" value="${r.dio?fmtMiles(r.dio):''}" placeholder="0" ${cellsLocked||!r.arrived?'disabled':''}></td>
      <td class="col-vta">${vtaHtml}</td>
      <td class="col-md"><button class="cell-btn ${r.modo==='E'?'md-e':r.modo==='N'?'md-n':''}" data-cycle-modo="${r.rowId}" ${cellsLocked||!r.arrived?'disabled':''}>${r.modo||'—'}</button></td>
    </tr>`;
  }

  let html = `<div class="sheet-wrap"><div class="sheet-scroll"><table class="sheet">

function renderHistorial(){
  const finished = weeksArr().filter(w=>w.phase==='finalizado').slice().reverse();
  if(finished.length===0){
    return `<div class="empty"><span class="ico">📋</span><p>Todavía no hay partidos finalizados en ${modeInfo().tabLabel.toLowerCase()}.</p></div>`;
  }
  let html = `<div class="eyebrow" style="margin-bottom:8px;">Historial ${modeInfo().tabLabel} · ${finished.length} partido${finished.length>1?'s':''}</div>`;
  finished.forEach(w=>{
    const d = fmtDateShort(w.date);
    const arrived = w.rows.filter(r=>r.arrived);
    let recaudado=0;
    arrived.forEach(r=>{ const st=paymentStatus(r); recaudado += Math.min(st.dio, st.owed); });
    html += `<div class="hist-item" data-view-week="${w.id}">
      <div class="hist-date">${d.num}<span class="dow">${d.mon}</span></div>
      <div class="hist-info">
        <div class="hmain">${arrived.length} jugadores</div>
        <div class="hsub">Recaudado $${fmt(recaudado)}</div>
      </div>
      <div class="stat-chip" style="min-width:auto;">${d.dow}</div>
      <button class="btn btn-xs btn-danger" data-delete-week="${w.id}" title="Eliminar">🗑</button>
    </div>`;
  });
  return html;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(s){ return escapeHtml(s); }
// Normaliza texto para buscar sin importar tildes/mayúsculas (ej: "jose" encuentra "José")
function normalizeSearch(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

/* ---------- DESCARGAR CONVOCADOS COMO IMAGEN ---------- */
function buildConvocadosCanvas(items, meta){
  const W = 720;
  const PAD = 26;
  const rowH = 56;
  const headerH = 168;
  const footerH = 46;
  const H = headerH + Math.max(items.length,1)*rowH + footerH;

  const canvas = document.createElement('canvas');
  const scale = 2; // nitidez para pantallas retina
  canvas.width = W*scale; canvas.height = H*scale;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // fondo
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#101a12');
  grad.addColorStop(1,'#0a120b');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // franja superior dorada
  ctx.fillStyle = '#FFC94D';
  ctx.fillRect(0,0,W,5);

  // header
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFC94D';
  ctx.font = '800 30px Arial';
  ctx.fillText(meta.title, W/2, 56);

  if(meta.sub){
    ctx.fillStyle = '#C9D0D3';
    ctx.font = '600 16px Arial';
    ctx.fillText(meta.sub, W/2, 84);
  }

  ctx.fillStyle = '#93A0A8';
  ctx.font = '700 13px monospace';
  ctx.fillText(`${items.length} JUGADOR${items.length===1?'':'ES'} CONVOCADO${items.length===1?'':'S'}`, W/2, 112);

  // pill contador dorado
  ctx.strokeStyle = 'rgba(255,201,77,0.5)';
  ctx.lineWidth = 1.5;
  const pillW = 168, pillH = 26;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(W/2 - pillW/2, 122, pillW, pillH, 13) : ctx.rect(W/2 - pillW/2, 122, pillW, pillH);
  ctx.stroke();

  // divisor
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.moveTo(PAD, headerH-8);
  ctx.lineTo(W-PAD, headerH-8);
  ctx.stroke();

  // filas
  if(items.length===0){
    ctx.fillStyle = '#93A0A8';
    ctx.font = '600 16px Arial';
    ctx.fillText('Todavía no hay jugadores convocados', W/2, headerH + rowH/2 + 6);
  } else {
    items.forEach((p,i)=>{
      const y = headerH + i*rowH;
      if(i%2===0){
        ctx.fillStyle = 'rgba(255,255,255,0.035)';
        ctx.fillRect(PAD-6, y+2, W-2*(PAD-6), rowH-8);
      }
      // numero
      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFC94D';
      ctx.font = '700 17px monospace';
      ctx.fillText(`${i+1}.`, PAD+38, y+rowH/2+6);
      // nombre
      ctx.textAlign = 'left';
      ctx.fillStyle = '#F5F6F2';
      ctx.font = '700 20px Arial';
      ctx.fillText(`${p.isGK?'🥅':'⚽'}  ${p.name}`, PAD+52, y+rowH/2+7);
      // check de llegada (si aplica)
      if(p.arrived){
        ctx.textAlign = 'right';
        ctx.fillStyle = '#37D67A';
        ctx.font = '700 16px Arial';
        ctx.fillText('✓', W-PAD, y+rowH/2+6);
      }
    });
  }

  // footer
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5f6b70';
  ctx.font = '700 11px monospace';
  ctx.fillText('⚽ FÚTBOL · LISTA DE CONVOCADOS', W/2, H-18);

  return canvas;
}

function downloadCanvasAsImage(canvas, filename){
  canvas.toBlob(blob=>{
    if(!blob){ showToast('No se pudo generar la imagen'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast('Imagen descargada 🖼️');
  }, 'image/png');
}

function convocadosItemsFromRows(rows){
  const gk = rows.filter(r=>r.isGK);
  const field = rows.filter(r=>!r.isGK);
  return [...gk, ...field].map(r=>({ name:r.name, isGK:r.isGK, arrived:!!r.arrived }));
}

function downloadConvocadosSabado(){
  const w = getCurrentWeek();
  if(!w){ showToast('No hay partido activo'); return; }
  const info = modeInfo();
  const items = convocadosItemsFromRows(w.rows);
  const canvas = buildConvocadosCanvas(items, {
    title: '⚽ CONVOCADOS',
    sub: `${fmtDateLong(w.date)} · ${fmtHora12(w.hora||info.defaultHora)} · ${w.lugar||info.defaultLugar}`
  });
  downloadCanvasAsImage(canvas, `convocados-${w.date}.png`);
}

function downloadConvocadosCamp(){
  const f = getCurrentFecha();
  if(!f){ showToast('No hay fecha activa'); return; }
  const info = modeInfo();
  const c = activeCampeonato();
  const items = convocadosItemsFromRows(f.rows);
  const canvas = buildConvocadosCanvas(items, {
    title: '🏆 CONVOCADOS',
    sub: `${c?c.nombre+' · ':''}${fmtDateLong(f.date)} · ${fmtHora12(f.hora||info.defaultHora)} · ${f.lugar||info.defaultLugar}`
  });
  downloadCanvasAsImage(canvas, `convocados-${f.date}.png`);
}

/* ---------- EVENTS ---------- */
function wireEvents(){
  const q = sel => document.querySelector(sel);
  const qa = sel => document.querySelectorAll(sel);

  const newWeekBtn = q('#newWeekBtn');
  if(newWeekBtn) newWeekBtn.onclick = newWeek;

  const changeDateBtn = q('#changeDateBtn');
  if(changeDateBtn) changeDateBtn.onclick = ()=>{
    const w = getCurrentWeek();
    const info = modeInfo();
    openModal(`<div class="modal-bg" id="modalBg"><div class="modal">
      <h3>${info.dateLabel}</h3>
      <p style="margin-bottom:6px;">Fecha</p>
      <input type="date" id="dateInput" value="${w.date}" style="width:100%; margin-bottom:12px;">
      <p style="margin-bottom:6px;">Hora</p>
      <input type="time" id="horaInput" value="${w.hora||info.defaultHora}" style="width:100%; margin-bottom:12px;">
      <p style="margin-bottom:6px;">Lugar</p>
      <input type="text" id="lugarInput" value="${escapeAttr(w.lugar||info.defaultLugar)}" placeholder="${info.defaultLugar}" style="width:100%;">
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" id="cancelDateBtn">Cancelar</button>
        <button class="btn btn-gold btn-block" id="saveDateBtn">Guardar</button>
      </div>
    </div></div>`);
    q('#cancelDateBtn').onclick = closeModal;
    q('#saveDateBtn').onclick = ()=>{
      w.date = q('#dateInput').value || w.date;
      w.hora = q('#horaInput').value || w.hora;
      w.lugar = (q('#lugarInput').value||'').trim() || w.lugar;
      saveData(); closeModal(); render();
    };
  };

  const editRosterBtn = q('#editRosterBtn');
  if(editRosterBtn) editRosterBtn.onclick = ()=>{ openModal(rosterEditorModal()); wireRosterModal(); };

  const pickFromRosterBtn = q('#pickFromRosterBtn');
  if(pickFromRosterBtn) pickFromRosterBtn.onclick = ()=>{
    const w = getCurrentWeek();
    openModal(weekPlayerPickerModal(w));
    wirePickerModal(w);
  };

  const downloadConvocadosBtn = q('#downloadConvocadosBtn');
  if(downloadConvocadosBtn) downloadConvocadosBtn.onclick = downloadConvocadosSabado;

  const backBtn = q('#backToCurrentBtn');
  if(backBtn) backBtn.onclick = ()=>{
    const hadCurrent = !!getCurrentWeek();
    historyViewId=null;
    if(!hadCurrent) tab='historial';
    render();
  };

  const reopenWeekBtn = q('#reopenWeekBtn');
  if(reopenWeekBtn) reopenWeekBtn.onclick = ()=>{
    const w = weeksArr().find(x=>x.id===historyViewId);
    if(!w) return;
    w.phase = 'jugando';
    historyViewId = null;
    saveData(); render();
    showToast('Partido reabierto ↺');
  };

  const deleteThisWeekBtn = q('#deleteThisWeekBtn');
  if(deleteThisWeekBtn) deleteThisWeekBtn.onclick = ()=>{
    const id = historyViewId;
    const w = weeksArr().find(x=>x.id===id);
    openModal(`<div class="modal-bg" id="modalBg"><div class="modal">
      <h3>¿Eliminar este partido?</h3>
      <p>${w ? fmtDateLong(w.date) : ''} — esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" id="cancelDeleteWeekBtn">Cancelar</button>
        <button class="btn btn-danger btn-block" id="confirmDeleteWeekBtn">Eliminar</button>
      </div>
    </div></div>`);
    q('#cancelDeleteWeekBtn').onclick = closeModal;
    q('#confirmDeleteWeekBtn').onclick = ()=>{
      setWeeksArr(weeksArr().filter(x=>x.id!==id));
      historyViewId = null;
      saveData(); closeModal(); tab='historial'; render(); showToast('Partido eliminado');
    };
  };

  qa('[data-view-week]').forEach(el=>{ el.onclick = ()=>{ pushNav(); historyViewId = el.dataset.viewWeek; tab='sabado'; render(); }; });

  qa('[data-delete-week]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.deleteWeek;
      const w = weeksArr().find(x=>x.id===id);
      openModal(`<div class="modal-bg" id="modalBg"><div class="modal">
        <h3>¿Eliminar este partido?</h3>
        <p>${w ? fmtDateLong(w.date) : ''} — esta acción no se puede deshacer.</p>
        <div class="modal-actions">
          <button class="btn btn-outline btn-block" id="cancelDeleteWeekBtn">Cancelar</button>
          <button class="btn btn-danger btn-block" id="confirmDeleteWeekBtn">Eliminar</button>
        </div>
      </div></div>`);
      q('#cancelDeleteWeekBtn').onclick = closeModal;
      q('#confirmDeleteWeekBtn').onclick = ()=>{
        setWeeksArr(weeksArr().filter(x=>x.id!==id));
        saveData(); closeModal(); render(); showToast('Partido eliminado');
      };
    };
  });

  const startGameBtn = q('#startGameBtn');
  if(startGameBtn) startGameBtn.onclick = ()=>{
    const w = getCurrentWeek();
    w.rows.forEach(r=>{ r.won = true; r.modo = 'E'; });
    w.phase='jugando'; saveData(); render(); showToast('¡Juego iniciado! Todos en Ganó / Efectivo ⚽');
  };

  const finishGameBtn = q('#finishGameBtn');
  if(finishGameBtn) finishGameBtn.onclick = ()=>{
    const w = getCurrentWeek();
    const arrived = w.rows.filter(r=>r.arrived);
    const pendientes = arrived.filter(r=> rowNeedsAction(r) || paymentStatus(r).state==='pendiente' || paymentStatus(r).state==='sin-resultado').length;
    if(pendientes>0){
      openModal(`<div class="modal-bg" id="modalBg"><div class="modal">
        <h3>¿Finalizar de todas formas?</h3>
        <p>${pendientes} jugador${pendientes>1?'es':''} todavía ${pendientes>1?'tienen':'tiene'} algo pendiente (pago o vuelto).</p>
        <div class="modal-actions">
          <button class="btn btn-outline btn-block" id="cancelFinishBtn">Seguir</button>
          <button class="btn btn-gold btn-block" id="confirmFinishBtn">Finalizar igual</button>
        </div>
      </div></div>`);
      q('#cancelFinishBtn').onclick = closeModal;
      q('#confirmFinishBtn').onclick = ()=>{ doFinish(w); closeModal(); };
    } else { doFinish(w); }
  };

  // sheet interactions
  qa('[data-toggle-arrived]').forEach(btn=>{
    btn.onclick = ()=>{
      const w = getCurrentWeek();
      const r = w.rows.find(x=>x.rowId===btn.dataset.toggleArrived);
      r.arrived = !r.arrived;
      if(!r.arrived){ r.won=true; r.dio=0; r.modo='E'; r.vueltoConfirmado=false; }
      saveData(); render();
    };
  });
  qa('[data-cycle-won]').forEach(btn=>{
    btn.onclick = ()=>{
      const w = getCurrentWeek();
      const r = w.rows.find(x=>x.rowId===btn.dataset.cycleWon);
      r.won = !(r.won===true);
      r.vueltoConfirmado = false;
      saveData(); render();
    };
  });
  qa('[data-dio]').forEach(inp=>{
    inp.onchange = ()=>{
      const w = getCurrentWeek();
      const r = w.rows.find(x=>x.rowId===inp.dataset.dio);
      r.dio = Math.round((parseFloat(inp.value)||0)*1000);
      r.vueltoConfirmado = false;
      saveData(); render();
    };
  });
  qa('[data-cycle-modo]').forEach(btn=>{
    btn.onclick = ()=>{
      const w = getCurrentWeek();
      const r = w.rows.find(x=>x.rowId===btn.dataset.cycleModo);
      r.modo = r.modo==='' ? 'E' : r.modo==='E' ? 'N' : '';
      saveData(); render();
    };
  });
  qa('[data-toggle-vuelto]').forEach(el=>{
    el.onclick = ()=>{
      const w = getCurrentWeek();
      const r = w.rows.find(x=>x.rowId===el.dataset.toggleVuelto);
      r.vueltoConfirmado = !r.vueltoConfirmado;
      saveData(); render();
      if(r.vueltoConfirmado) showToast('Vuelto marcado como entregado ✓');
    };
  });

  // quick add player (within current week + roster)
  const quickAddBtn = q('#quickAddBtn');
  function quickAdd(){
    const w = getCurrentWeek();
    const inp = q('#quickAddInput');
    const name = (inp.value||'').trim();
    if(!name) return;
    const isGK = q('#quickAddGK').checked;
    if(!canAddToWeek(w, isGK)){
      showToast(isGK ? `Máximo ${MAX_GK} arqueros en el partido` : `Máximo ${MAX_FIELD} jugadores en el partido`);
      return;
    }
    let rp = roster().find(p=>p.name.toLowerCase()===name.toLowerCase());
    if(!rp){ rp = {id:uid(), name, isGK}; roster().push(rp); }
    w.rows.push(makeRow(rp, {arrived:true}));
    saveData(); render();
    setTimeout(()=>{ const i=q('#quickAddInput'); if(i) i.focus(); }, 0);
  }
  if(quickAddBtn) quickAddBtn.onclick = quickAdd;
  const quickAddInput = q('#quickAddInput');

function buildWspMessage(name){
  const primerNombre = (name||'').trim().split(' ')[0];
  const info = modeInfo();
  const w = mode==='sabado' ? getCurrentWeek() : getCurrentFecha();
  const horaTxt = fmtHora12((w && w.hora) || info.defaultHora);
  const lugarTxt = (w && w.lugar) || info.defaultLugar;
  return `Eyy ${primerNombre} ⚽, te recuerdo el partido a las ${horaTxt}. En ${lugarTxt}. Ojo puntual ⏰.
Confirmando ✅`;
}
function sendWsp(p){
  if(!p || !p.phone) return;

  const phone = String(p.phone).replace(/[^0-9]/g,'');
  const text = encodeURIComponent(buildWspMessage(p.name));


  // Intent de Android: fuerza el paquete de WhatsApp normal
  // (com.whatsapp), evitando que se abra WhatsApp Business.
  const intentUrl =
    `intent://send?phone=${phone}&text=${text}` +
    `#Intent;scheme=whatsapp;package=com.whatsapp;end`;

  // En Android intent:// permite seleccionar directamente la app
  // indicada. Si el navegador no admite intent://, usamos el enlace
  // normal como respaldo.
  try {
    window.location.href = intentUrl;
  } catch(e) {
    window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
  }
}

function wireRosterModal(){
  const q = sel => document.querySelector(sel);
  const qa = sel => document.querySelectorAll(sel);

  function applyFilter(){
    const search = q('#rosterSearch');
    const v = normalizeSearch(search ? search.value : '');
    qa('[data-roster-row-name]').forEach(el=>{ el.style.display = el.dataset.rosterRowName.includes(v) ? 'flex' : 'none'; });
  }

  function refreshList(){
    const w = getCurrentWeek();
    const list = q('#rosterList');
    if(list) list.innerHTML = rosterListHtml(w);
    wireRows();
    applyFilter();
  }

  function wireRows(){
    qa('[data-roster-name]').forEach(inp=>{
      inp.onchange = ()=>{
        const p = roster().find(x=>x.id===inp.dataset.rosterName);
        p.name = inp.value.trim() || p.name;
        const w = getCurrentWeek();
        if(w){ w.rows.filter(r=>r.playerId===p.id).forEach(r=> r.name = p.name); }
        saveData();
      };
    });
    qa('[data-roster-gk]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.rosterGk);
        p.isGK = !p.isGK;
        saveData();
        refreshList();
      };
    });
    qa('[data-roster-remove]').forEach(btn=>{
      btn.onclick = ()=>{
        const pid = btn.dataset.rosterRemove;
        data().roster = roster().filter(x=>x.id!==pid);
        const w = getCurrentWeek();
        if(w) w.rows = w.rows.filter(r=>r.playerId!==pid);
        saveData();
        refreshList();
      };
    });
    qa('[data-roster-convene]').forEach(btn=>{
      btn.onclick = ()=>{
        const w = getCurrentWeek();
        if(!w) return;
        const pid = btn.dataset.rosterConvene;
        const idx = w.rows.findIndex(r=>r.playerId===pid);
        if(idx>=0){
          w.rows.splice(idx,1);
        } else {
          const rp = roster().find(p=>p.id===pid);
          if(!rp) return;
          if(!canAddToWeek(w, rp.isGK)){
            showToast(rp.isGK ? `Máximo ${MAX_GK} arqueros en el partido` : `Máximo ${MAX_FIELD} jugadores en el partido`);
            return;
          }
          w.rows.push(makeRow(rp));
        }
        saveData();
        refreshList();
      };
    });
    qa('[data-roster-phone-edit]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.rosterPhoneEdit);
        if(!p) return;
        openPhoneEditModal(p);
      };
    });
    qa('[data-roster-wsp]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = roster().find(x=>x.id===btn.dataset.rosterWsp);
        sendWsp(p);
      };
    });
  }
  wireRows();

  const search = q('#rosterSearch');
  if(search) search.oninput = applyFilter;

  let bulkQueue = [];
  let bulkIndex = 0;
  function renderBulkStep(){
    const box = q('#bulkReminderBox');
    if(!box) return;
    if(bulkIndex >= bulkQueue.length){
      box.innerHTML = `<p style="font-size:11px;color:var(--win);text-align:center;">✅ Recordatorio enviado a los ${bulkQueue.length} convocados.</p>`;
      return;
    }
    const p = bulkQueue[bulkIndex];
    box.innerHTML = `<div style="display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:7px 8px;">
      <span style="flex:1; font-size:11px;">👉 Siguiente: <b>${escapeHtml(p.name)}</b> (${bulkIndex+1}/${bulkQueue.length})</span>
      <button class="btn btn-wsp btn-xs" id="bulkSendStepBtn">💬 Enviar</button>
      <button class="btn btn-xs btn-outline" id="bulkCancelBtn">✕</button>
    </div>`;
    q('#bulkSendStepBtn').onclick = ()=>{ sendWsp(p); bulkIndex++; renderBulkStep(); };
    q('#bulkCancelBtn').onclick = ()=>{ box.innerHTML = ''; };
  }
  const bulkBtn = q('#bulkWspBtn');
  if(bulkBtn){
    bulkBtn.onclick = ()=>{
      const w = getCurrentWeek();
      if(!w) return;
      bulkQueue = w.rows.map(r=>roster().find(p=>p.id===r.playerId)).filter(p=>p && p.phone);
      bulkIndex = 0;
      renderBulkStep();
    };
  }

  const addBtn = q('#rosterAddBtn');
  function addRoster(){
    const inp = q('#rosterAddInput');
    const name = (inp.value||'').trim();
    if(!name) return;
    const isGK = q('#rosterAddGK').checked;
    roster().push({id:uid(), name, isGK});
    saveData();
    closeModal();
    openModal(rosterEditorModal());
    wireRosterModal();
  }
  if(addBtn) addBtn.onclick = addRoster;
  const addInput = q('#rosterAddInput');
  if(addInput) addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addRoster(); } });

  const closeBtn = q('#closeRosterBtn');
  if(closeBtn) closeBtn.onclick = ()=>{ closeModal(); render(); };
}

function renderCampFechasTab(){
  const f = activeFecha();
  const readOnly = !!historyViewId;
  const info = modeInfo();
  const cfg = campConfig();

  let html = '';

  if(!f){
    html += `<div class="empty"><span class="ico">🏟️</span><p>${info.emptyMsg}</p>
      <button class="btn btn-gold" id="newFechaBtn">${info.newBtnLabel}</button></div>`;
    html += campConfigSummaryBar(cfg);
    return html;
  }

  if(readOnly){
    const currentActive = getCurrentFecha();
    const canReopen = f.phase==='finalizado' && !currentActive;
    html += `<div class="row" style="gap:8px; margin-bottom:10px;">
      <button class="btn btn-outline btn-block" id="backToCurrentFechaBtn">${currentActive ? '← Volver a la fecha actual' : '← Volver al historial'}</button>
      ${canReopen ? `<button class="btn btn-gold" id="reopenFechaBtn" style="flex:0 0 auto;">↺ Reabrir</button>` : ''}
      <button class="btn btn-danger" id="deleteThisFechaBtn" style="flex:0 0 auto;">🗑</button>
    </div>`;
    if(f.phase==='finalizado' && currentActive){
      html += `<div class="empty" style="padding:6px 0 14px;"><p style="margin:0;">Tienes otra fecha activa. Termínala antes de reabrir esta.</p></div>`;
    }
  }

  const idx = fechaIndex(f);
  html += `<div class="topline">
    <div>
      <div class="eyebrow">Fecha ${idx+1} · ${fmtDateLong(f.date)}</div>
      <div style="font-size:11px; color:var(--chalk-dim); margin-top:2px;">🕒 ${fmtHora12(f.hora||info.defaultHora)} · 📍 ${escapeHtml(f.lugar||info.defaultLugar)}</div>
      ${f.rival ? `<div style="font-size:11px; margin-top:2px;">⚔️ ${campMarcadorLine(f)}</div>` : ''}
      <span class="phase-chip phase-${f.phase}">${phaseLabel(f.phase)}</span>
    </div>
    <div class="mini-title">${info.titleHtml}</div>
    <div style="display:flex; gap:6px;">
      ${!readOnly ? `<button class="btn btn-outline btn-xs" id="editCampConfigTopBtn">⚙️</button>` : ''}
      <button class="btn btn-outline btn-xs" id="changeFechaBtn">📅</button>
      ${!readOnly ? `<button class="btn btn-outline btn-xs" id="editCampRosterBtn">✎ Plantel</button>` : ''}
    </div>
  </div>`;

  const cellsLocked = f.phase !== 'jugando';
  const showAdd = !readOnly;
  const arrived = f.rows.filter(r=>r.arrived);

  if(f.phase==='jugando' && arrived.length>0){
    let recaudado=0, efectivo=0, nequi=0, recArb=0, recInsc=0;
    arrived.forEach(r=>{
      const deb = rowDebido(r,f);
      // Se cuenta TODO lo que dio el jugador, no solo hasta lo que "debía" ese día:
      // si da de más, ese excedente es plata real recibida (abono adelantado a inscripción).
      const dio = r.dio||0;
      recaudado += dio;
      if(r.modo==='E') efectivo += dio;
      if(r.modo==='N') nequi += dio;
      // El arbitraje se cobra primero (es del día, tope fijo); el resto de lo dado va a inscripción,
      // incluso si excede la cuota del día (queda como abono a favor).
      const arbPagado = Math.min(dio, deb.arbitraje);
      const inscPagado = dio - arbPagado;
      recArb += arbPagado;
      recInsc += inscPagado;
    });
    html += `<div class="stats-strip">
      <div class="stat-chip gold"><div class="slabel">Total recaudado</div><div class="sval" id="campStatRecaudado">$${fmt(recaudado)}</div></div>
      <div class="stat-chip"><div class="slabel">Llegaron</div><div class="sval">${arrived.length}/${f.rows.length}</div></div>
      <div class="stat-chip win"><div class="slabel">Efectivo</div><div class="sval" id="campStatEfectivo">$${fmt(efectivo)}</div></div>
      <div class="stat-chip win"><div class="slabel">Nequi</div><div class="sval" id="campStatNequi">$${fmt(nequi)}</div></div>
    </div>
    <div class="stats-strip" style="margin-top:6px;">
      <div class="stat-chip"><div class="slabel">Recaudado arbitraje</div><div class="sval" id="campStatRecArb">$${fmt(recArb)}</div></div>
      <div class="stat-chip"><div class="slabel">Recaudado inscripción</div><div class="sval" id="campStatRecInsc">$${fmt(recInsc)}</div></div>
      <div class="stat-chip gold"><div class="slabel">Total bruto</div><div class="sval" id="campStatBruto">$${fmt(recArb+recInsc)}</div></div>
    </div>`;
  }

  html += renderCampSheet(f, cellsLocked || readOnly, showAdd);

  if(!readOnly){
    if(f.phase==='armando'){
      html += `<button class="btn btn-gold btn-block" id="startFechaBtn" style="margin-top:6px;" ${f.rows.length===0?'disabled':''}>▶ Iniciar fecha</button>`;
    } else if(f.phase==='jugando'){
      html += `<button class="btn btn-gold btn-block" id="finishFechaBtn" style="margin-top:6px;">🏁 Finalizar fecha</button>`;
    }
  }

  return html;
}

function renderCampSheet(f, cellsLocked, showAdd){
  const gkRows = f.rows.filter(r=>r.isGK);
  const fieldRows = f.rows.filter(r=>!r.isGK);

  function rowHtml(r, num, icon){
    const deb = rowDebido(r, f);
    const dio = r.dio||0;
    const saldo = dio - deb.total;
    let trClass = r.isGK ? 'row-gk' : '';
    const complete = r.arrived && !r.isGK && saldo===0;
    const needsAction = r.arrived && !r.isGK && saldo<0;
    if(complete) trClass += ' row-complete';
    else if(needsAction) trClass += ' row-action';
    else if(r.arrived) trClass += ' row-arrived';

    let saldoHtml;
    if(!r.arrived || r.isGK) saldoHtml = `<span class="vta-val pend">—</span>`;
    else if(dio===0) saldoHtml = `<span class="vta-val pend">·</span>`;
    else if(saldo===0) saldoHtml = `<span class="vta-val exacto">✓ ok</span>`;
    else if(saldo<0) saldoHtml = `<span class="vta-val falta">-${fmtK(-saldo)}</span>`;
    else saldoHtml = `<span class="vta-val devolver confirmed">+${fmtK(saldo)}</span>`;

    return `<tr class="${trClass}" id="camprow-${r.rowId}">
      <td class="col-num sticky-col"><span class="rownum">${num}.</span></td>
      <td class="col-name sticky-col"><span class="rname">${icon} ${escapeHtml(r.name)}</span></td>
      <td class="col-ll"><button class="cell-btn ${r.arrived?'ll-on':''}" data-toggle-camp-arrived="${r.rowId}" ${cellsLocked?'disabled':''}>${r.arrived?'✓':''}</button></td>
      <td class="col-arb"><span class="pago-val">${r.isGK?'—':(r.arrived?fmtK(deb.arbitraje):'—')}</span></td>
      <td class="col-insc"><span class="pago-val">${r.isGK?'—':(r.arrived?fmtK(deb.inscripcion):'—')}</span></td>
      <td class="col-total"><span class="pago-val" style="color:var(--gold); font-weight:700;">${r.isGK?'—':(r.arrived?fmtK(deb.total):'—')}</span></td>
      <td class="col-dio"><input type="number" min="0" step="0.5" class="dio-input" data-camp-dio="${r.rowId}" value="${r.dio?fmtMiles(r.dio):''}" placeholder="0" ${cellsLocked||!r.arrived||r.isGK?'disabled':''}></td>
      <td class="col-vta" id="saldo-${r.rowId}">${saldoHtml}</td>
      <td class="col-md"><button class="cell-btn ${r.modo==='E'?'md-e':r.modo==='N'?'md-n':''}" data-cycle-camp-modo="${r.rowId}" ${cellsLocked||!r.arrived||r.isGK?'disabled':''}>${r.modo||'—'}</button></td>

function renderCampFinanzas(){
  const cfg = campConfig();
  if(!cfg) return renderCampConfigSetup();
  const t = campTotals();

  let html = `<div class="eyebrow" style="margin-bottom:8px;">Finanzas del campeonato · solo inscripción</div>`;
  html += `<div class="stats-strip">
    <div class="stat-chip"><div class="slabel">Inscripción total</div><div class="sval">$${fmt(t.inscripcionTotal)}</div></div>
    <div class="stat-chip win"><div class="slabel">Recaudado</div><div class="sval">$${fmt(t.inscripcionRecaudadaTotal)}</div></div>
    <div class="stat-chip ${t.inscripcionPendienteTotal>0?'warn':''}"><div class="slabel">Pendiente</div><div class="sval">$${fmt(t.inscripcionPendienteTotal)}</div></div>
    <div class="stat-chip"><div class="slabel">Fechas jugadas</div><div class="sval">${t.fechasJugadas}</div></div>
    <div class="stat-chip"><div class="slabel">Fechas restantes</div><div class="sval">${t.fechasRestantes}</div></div>
    <div class="stat-chip gold"><div class="slabel">Excedente redondeo</div><div class="sval">$${fmt(t.excedente)}</div></div>
  </div>`;


  html += `<div class="eyebrow" style="margin:12px 0 6px;">Por jugador · inscripción: cuánto le toca, cuánto ha dado y cuánto le falta</div>`;
  html += `<div class="sheet-wrap"><div class="sheet-scroll" style="max-height:none;"><table class="sheet">
    <thead><tr>
      <th class="col-name th-name sticky-col">Jugador</th>
      <th>Le toca</th>
      <th>Ha dado</th>
      <th>Le falta</th>
    </tr></thead>
    <tbody>`;
  const sortedPlayers = t.players.slice().sort((a,b)=>{
    if(!!a.archived !== !!b.archived) return a.archived ? 1 : -1;
    if(!!a.isGK !== !!b.isGK) return a.isGK ? 1 : -1;
    return b.debeInsc - a.debeInsc;
  });
  sortedPlayers.forEach(p=>{
    const falta = p.debeInsc; // positivo = debe, negativo = a favor
    const faltaColor = falta>0 ? 'var(--lose)' : falta<0 ? 'var(--win)' : 'var(--chalk-dim)';
    const faltaTxt = p.archived ? '—' : (falta>0 ? '-$'+fmt(falta) : falta<0 ? '+$'+fmt(-falta) : '$0');
    const sinFechas = p.fechasJugadas===0;
    html += `<tr class="${p.isGK?'row-gk':''}" style="${p.archived?'opacity:0.55;':''}">
      <td class="col-name sticky-col"><span class="rname">${p.isGK?'🥅 ':'⚽ '}${escapeHtml(p.name)}${p.archived?' <span style="color:var(--chalk-dim);font-weight:400;font-size:9px;">(archivado)</span>':(sinFechas && !p.isGK?' <span style="color:var(--chalk-dim);font-weight:400;font-size:9px;">(no ha pagado)</span>':'')}</span></td>
      <td style="text-align:center; font-family:'JetBrains Mono'; font-size:9.5px;">${p.archived?'—':'$'+fmt(p.leToca)}</td>
      <td style="text-align:center; font-family:'JetBrains Mono'; font-size:9.5px; color:var(--gold); font-weight:700;">$${fmt(p.insc)}</td>
      <td style="text-align:center; font-family:'JetBrains Mono'; font-size:9.5px; color:${faltaColor}; font-weight:700;">${faltaTxt}</td>
    </tr>`;
  });
  if(t.players.length===0){
    html += `<tr><td colspan="4" style="padding:18px; color:var(--chalk-dim); text-align:center;">Agrega jugadores al plantel del campeonato</td></tr>`;
  }
  html += `</tbody></table></div></div>`;

  return html;
}

function renderCampHistorialTab(){
  const cfg = campConfig();
  if(!cfg) return renderCampConfigSetup();
  const finished = campFechas().filter(f=>f.phase==='finalizado').slice().reverse();
  if(finished.length===0){
    return `<div class="empty"><span class="ico">📋</span><p>Todavía no hay fechas finalizadas del campeonato.</p></div>`;
  }
  let html = `<div class="eyebrow" style="margin-bottom:8px;">Historial del campeonato · ${finished.length} fecha${finished.length>1?'s':''}</div>`;
  finished.forEach(f=>{
    const d = fmtDateShort(f.date);
    const arrived = f.rows.filter(r=>r.arrived);
    const recaudado = arrived.reduce((s,r)=> s + (r.dio||0), 0);
    const vsTxt = f.rival ? ` · ${campMarcadorLine(f)}` : '';
    html += `<div class="hist-item" data-view-camp-fecha="${f.id}">

  return html;
}

function renderCampEstadisticaTab(){
  const cfg = campConfig();
  if(!cfg) return renderCampConfigSetup();
  const ms = campMatchStats();
  const equipo = campEquipoNombre();
  // orden cronológico (Fecha 1 primero), como una tabla de posiciones normal
  const matches = campFechas().filter(f=>f.phase==='finalizado' && f.resultado).slice()
    .sort((a,b)=> fechaIndex(a)-fechaIndex(b));

  let html = `<div class="eyebrow" style="margin-bottom:8px;">${escapeHtml(equipo)} · estadísticas</div>`;
  html += `<div class="stats-strip">
    <div class="stat-chip"><div class="slabel">Jugados</div><div class="sval">${ms.jugados}</div></div>
    <div class="stat-chip win"><div class="slabel">Ganados</div><div class="sval">${ms.g}</div></div>
    <div class="stat-chip"><div class="slabel">Empatados</div><div class="sval">${ms.e}</div></div>
    <div class="stat-chip ${ms.p>0?'warn':''}"><div class="slabel">Perdidos</div><div class="sval">${ms.p}</div></div>
    <div class="stat-chip gold"><div class="slabel">Puntos</div><div class="sval">${ms.puntos}</div></div>
  </div>`;

  if(matches.length>0){
    const forma = matches.slice(-5); // últimos 5, orden cronológico
    html += `<div class="eyebrow" style="margin:12px 0 6px;">Racha reciente</div>
    <div style="display:flex; gap:6px; margin-bottom:4px;">`;
    forma.forEach(f=>{
      const map = { G:{t:'G',c:'var(--win)'}, P:{t:'P',c:'var(--lose)'}, E:{t:'E',c:'var(--gold)'} };
      const info = map[f.resultado] || {t:'?',c:'var(--chalk-dim)'};
      html += `<div style="width:26px; height:26px; border-radius:50%; background:${info.c}; color:#0a0f0a; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:12px;">${info.t}</div>`;
    });
    html += `</div>`;
  }

  html += `<div class="eyebrow" style="margin:14px 0 6px;">Tabla de resultados</div>`;
  html += `<div class="sheet-wrap"><div class="sheet-scroll" style="max-height:none;"><table class="sheet">
    <thead><tr>
      <th class="col-name th-name sticky-col">Rival</th>
      <th>GF</th>
      <th>GC</th>
      <th>DG</th>
      <th>Pts</th>
    </tr></thead>
    <tbody>`;
  if(matches.length===0){
    html += `<tr><td colspan="5" style="padding:18px; color:var(--chalk-dim); text-align:center;">Todavía no hay resultados registrados. Anota el rival y el marcador desde el botón 📅 de cada fecha.</td></tr>`;
  } else {
    matches.forEach(f=>{
      const gf = f.golesFavor||0, gc = f.golesContra||0, dg = gf-gc;
      const map = { G:'var(--win)', P:'var(--lose)', E:'var(--gold)' };
      const color = map[f.resultado] || 'var(--chalk-dim)';
      const pts = f.resultado==='G' ? 2 : f.resultado==='E' ? 1 : 0;
      const dgTxt = dg>0 ? `+${dg}` : `${dg}`;
      html += `<tr>
        <td class="col-name sticky-col"><span class="rname">${escapeHtml(f.rival||('Fecha '+(fechaIndex(f)+1)))}</span></td>
        <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10px; font-weight:700;">${gf}</td>
        <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10px;">${gc}</td>
        <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10px; color:${color}; font-weight:700;">${dgTxt}</td>
        <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10px; color:var(--gold); font-weight:700;">${pts}</td>
      </tr>`;
    });
    const dgTotal = ms.gf - ms.gc;
    const dgTotalTxt = dgTotal>0 ? `+${dgTotal}` : `${dgTotal}`;
    html += `<tr style="background:rgba(255,201,77,0.08); border-top:2px solid var(--gold);">
      <td class="col-name sticky-col" style="background:rgba(255,201,77,0.08);"><span class="rname" style="color:var(--gold); text-transform:uppercase; font-size:10.5px;">Total</span></td>
      <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10.5px; font-weight:900; color:var(--gold);">${ms.gf}</td>
      <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10.5px; font-weight:900; color:var(--gold);">${ms.gc}</td>
      <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10.5px; font-weight:900; color:var(--gold);">${dgTotalTxt}</td>
      <td style="text-align:center; font-family:'JetBrains Mono'; font-size:10.5px; font-weight:900; color:var(--gold);">${ms.puntos}</td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;

  return html;
}

function wireCampPickerModal(f){
  const q = sel => document.querySelector(sel);
  const qa = sel => document.querySelectorAll(sel);

  qa('[data-camp-pick]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.campPick;
      const idx = f.rows.findIndex(r=>r.playerId===id);
      if(idx>=0){
        f.rows.splice(idx,1);
      } else {
        const rp = roster().find(p=>p.id===id);

          showToast(rp.isGK ? `Máximo ${MAX_GK} arqueros en la fecha` : `Máximo ${MAX_FIELD} jugadores en la fecha`);

        f.rows.push(makeCampRow(rp));
      }
      saveData();
      const nowSel = f.rows.some(r=>r.playerId===id);
      const badge = el.querySelector('span');
      badge.style.borderColor = nowSel ? 'var(--win)' : 'var(--chalk-dim)';
      badge.style.background = nowSel ? 'var(--win)' : 'none';
      badge.textContent = nowSel ? '✓' : '';
    };

function campRosterListHtml(f){
  const activePlayers = roster().filter(p=>!p.archived);
  if(activePlayers.length===0) return '';
  if(!f) return sortGkFirst(activePlayers).map(p=>campRosterRowHtml(p, f)).join('');
  const inFechaIds = new Set(f.rows.map(r=>r.playerId));
  const convocados = sortGkFirst(activePlayers.filter(p=>inFechaIds.has(p.id)));
  const resto = sortGkFirst(activePlayers.filter(p=>!inFechaIds.has(p.id)));
  let html = '';
  if(convocados.length){
    html += `<div class="picker-group-label">✓ Convocados (${convocados.length})</div>`;
    html += convocados.map(p=>campRosterRowHtml(p,f)).join('');
  }
  if(resto.length){
    if(convocados.length) html += `<div class="picker-group-label">Plantel</div>`;
    html += resto.map(p=>campRosterRowHtml(p,f)).join('');
  }
  return html;
}
